  <div id="root" class="group_w6-root" data-composition-id="group_w6" data-width="1920" data-height="1080" data-duration="16.752" data-layout-allow-overflow="true" style="position:relative; width:1920px; height:1080px; overflow:hidden;">

        mix-blend-mode: multiply;

        will-change: transform;

        width: 480px;
        height: 560px;
        overflow: visible;
      }

      /* All hand paths: stroke-only ink reveal */
      #g6-hand-svg path,
      #g6-hand-svg line {
        fill: none;
        stroke: var(--brand-primary);
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Ink halo / pulse ring from svg-icon-enrichment */
      #g6-palm-ring {
        fill: none;
        stroke: var(--brand-primary);
        stroke-width: 2.5;
        stroke-linecap: round;
        transform-box: fill-box;

        <svg id="s7-diagram-svg" viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Traditional top-down power arrow (left side) -->
          <path id="s7-arrow-down" d="M 100 20 L 100 120 L 80 100 M 100 120 L 120 100" stroke-width="3.5"/>
          <text x="60" y="14" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" fill="var(--brand-primary)" letter-spacing="0.12em" text-anchor="middle" font-weight="500">CROWN</text>
          <text x="60" y="140" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" fill="var(--brand-primary)" letter-spacing="0.12em" text-anchor="middle" font-weight="500">SUBJECT</text>

          <!-- Dividing hairline -->
          <line id="s7-divider" x1="220" y1="10" x2="220" y2="190" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>

          <!-- Empathy upward arrow (right side) -->
          <path id="s7-arrow-up" d="M 380 130 L 380 30 L 360 50 M 380 30 L 400 50" stroke="var(--brand-accent)" stroke-width="3.5"/>
          <text x="420" y="140" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" fill="var(--brand-accent)" letter-spacing="0.12em" text-anchor="middle" font-weight="500">PEOPLE</text>
          <text x="420" y="20" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" fill="var(--brand-accent)" letter-spacing="0.12em" text-anchor="middle" font-weight="500">DIANA</text>

    </div><!-- end g6-camera -->

    <script>
      const EASE = {
        entry: "power2.out",
        emphasis: "power3.out",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 0.95,
      };

      window.__timelines = window.__timelines || {};

      // ── Timeline boundary markers ──
      const T = { scene_6: 0, scene_7: 6 };

      const tl = gsap.timeline({ paused: true });

      // ── Initial hidden states (gsap.set — not CSS) ──
      // Scene 6 starts: all paths hidden, eyebrow hidden, scribble hidden, ring hidden
      const handPaths = document.querySelectorAll(
        "#g6-wrist, #g6-palm-left, #g6-palm-right, #g6-palm-arch, #g6-thumb, #g6-index, #g6-middle, #g6-ring, #g6-little, #g6-lifeline"
      );
      handPaths.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });
      const ringEl = document.getElementById("g6-palm-ring");
      const ringLen = ringEl.getTotalLength();
      ringEl.style.strokeDasharray = String(ringLen);
      ringEl.style.strokeDashoffset = String(ringLen);

      gsap.set("#s6-eyebrow", { opacity: 0, y: -14 });
      gsap.set("#s6-scribble", { opacity: 0 });
      gsap.set("#s7-eyebrow", { opacity: 0 });
      gsap.set("#s7-diagram-wrap", { opacity: 0 });

      // Scene 7 figures — all hidden at start
      const figures = document.querySelectorAll(".g6-figure");
      figures.forEach((el) => {
        gsap.set(el, { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.5, opacity: 0 });
      });

      // Scene 7 diagram paths
      const diagPaths = document.querySelectorAll("#s7-arrow-down, #s7-arrow-up, #s7-divider");
      diagPaths.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      // ══════════════════════════════════════════════════
      // SCENE 6: "The Ungloved Hand"   t=0 → t=6
      // ══════════════════════════════════════════════════

      // 6.1 Slow camera drift for scene 6 — barely moves (film direction: macro = slow drift)
      tl.fromTo(
        "#g6-camera",
        { x: 0, y: 0 },
        { x: 8, y: -6, duration: 6, ease: "sine.inOut" },
        T.scene_6
      );

      // 6.2 Eyebrow dateline fades in immediately
      tl.fromTo(
        "#s6-eyebrow",
        { opacity: 0, y: -14 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry },
        T.scene_6 + 0.15
      );

      // 6.3 SVG path draw — hand draws wrist to fingertips over ~2.5s
      // Wrist base first
      tl.to("#g6-wrist",      { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, T.scene_6 + 0.2);
      // Palm edges build simultaneously
      tl.to("#g6-palm-left",  { strokeDashoffset: 0, duration: 0.70, ease: "power2.out" }, T.scene_6 + 0.55);
      tl.to("#g6-palm-right", { strokeDashoffset: 0, duration: 0.70, ease: "power2.out" }, T.scene_6 + 0.60);
      // Palm arch closes the base
      tl.to("#g6-palm-arch",  { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, T.scene_6 + 1.05);
      // Thumb
      tl.to("#g6-thumb",      { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, T.scene_6 + 1.20);
      // Four fingers in quick stagger — left to right
      tl.to("#g6-index",      { strokeDashoffset: 0, duration: 0.52, ease: "power2.out" }, T.scene_6 + 1.38);
      tl.to("#g6-middle",     { strokeDashoffset: 0, duration: 0.52, ease: "power2.out" }, T.scene_6 + 1.60);
      tl.to("#g6-ring",       { strokeDashoffset: 0, duration: 0.48, ease: "power2.out" }, T.scene_6 + 1.80);
      tl.to("#g6-little",     { strokeDashoffset: 0, duration: 0.44, ease: "power2.out" }, T.scene_6 + 1.98);
      // Subtle lifeline
      tl.to("#g6-lifeline",   { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" }, T.scene_6 + 2.28);

      // Hand fully drawn at ~2.68s — stillness holds

      // 6.4 SVG icon enrichment — ink-ring radiates at ~3.0s
      // The ring draws on (stroke reveal), then stays breathing via sine-wave-loop
      tl.to(
        "#g6-palm-ring",
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        T.scene_6 + 3.0
      );

      // 6.5 Sine-wave-loop on ring: breathing ±1% scale (icon enrichment ambient)
      // Drive via a phase proxy
      const ringPhase = { p: 0 };
      tl.to(
        ringPhase,
        {
          p: Math.PI * 2 * 1.2, // ~1.2 cycles over remaining ~2.3s
          duration: 2.3,
          ease: "none",
          onUpdate: () => {
            const s = 1 + Math.sin(ringPhase.p) * 0.01;
            const cx = 120, cy = 200;
            ringEl.setAttribute(
              "transform",
              `translate(${cx} ${cy}) scale(${s}) translate(-${cx} -${cy})`
            );
          },
        },
        T.scene_6 + 3.5
      );

      // 6.6 Scribble note appears after stillness hold (~3.35s)
      tl.fromTo(
        "#s6-scribble",
        { opacity: 0 },
        { opacity: 1, duration: DUR.slow, ease: EASE.entry },
        T.scene_6 + 3.35
      );

      // ══════════════════════════════════════════════════
      // SCENE 7: "The Currency of Empathy"  t=6 → t=16.752
      // ══════════════════════════════════════════════════

      // 7.0 Scene 6 ui fades out at boundary
      tl.to("#s6-eyebrow",  { opacity: 0, duration: DUR.med, ease: EASE.exit }, T.scene_7 + 0.0);
      tl.to("#s6-scribble", { opacity: 0, duration: DUR.med, ease: EASE.exit }, T.scene_7 + 0.0);

      // 7.1 Scene 7 eyebrow fades in
      tl.fromTo(
        "#s7-eyebrow",
        { opacity: 0, y: -12 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry },
        T.scene_7 + 0.4
      );

      // 7.2 Slow push-in on camera (macro motion scene 7)
      tl.fromTo(
        "#g6-camera",
        { scale: 1.0 },
        { scale: 1.06, duration: 10.752, ease: "power1.inOut" },
        T.scene_7
      );

      // 7.3 center-outward-expansion — 8 figures burst from hand center
      // ENTRY_AT offset from scene 7 start = 0.5s
      const EXPAND_DUR = 1.4;
      const STAGGER_GAP = 0.055;
      figures.forEach((el, i) => {
        const targetX = Number(el.dataset.targetX);
        const targetY = Number(el.dataset.targetY);
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.5, opacity: 0 },
          { x: targetX, y: targetY, scale: 1, opacity: 1, duration: EXPAND_DUR, ease: "power3.out" },
          T.scene_7 + 0.5 + i * STAGGER_GAP
        );
      });

      // 7.4 Sine-wave-loop on crowd — ±2px correlated drift as a mass
      // Starts after expansion lands (~0.5 + EXPAND_DUR = 1.95s after scene_7)
      const crowdPhase = { p: 0 };
      const CROWD_IDLE_START = T.scene_7 + 2.0;
      const CROWD_IDLE_DUR = 10.752 - 2.0; // runs to end
      tl.to(
        crowdPhase,
        {
          p: Math.PI * 2 * 3.5, // ~3.5 cycles across idle
          duration: CROWD_IDLE_DUR,
          ease: "none",
          onUpdate: () => {
            const dy = Math.sin(crowdPhase.p) * 2.0;
            figures.forEach((el) => {
              const tx = Number(el.dataset.targetX);
              const ty = Number(el.dataset.targetY);
              el.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty + dy}px))`;
            });
          },
        },
        CROWD_IDLE_START
      );

      // 7.5 svg-path-draw: connecting dashed arcs between hand and figures
      // The diagram traces after crowd has landed (~2.2s into scene 7)
      tl.fromTo(
        "#s7-diagram-wrap",
        { opacity: 0 },
        { opacity: 1, duration: DUR.med, ease: EASE.entry },
        T.scene_7 + 2.1
      );
      tl.to("#s7-divider",    { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, T.scene_7 + 2.3);
      tl.to("#s7-arrow-down", { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" }, T.scene_7 + 2.6);
      tl.to("#s7-arrow-up",   { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" }, T.scene_7 + 3.1);

      // 7.6 Sine-wave-loop on hand (persistent from scene 6) — gentle breathing ±1.5px
      const handPhase = { p: 0 };
      const HAND_IDLE_DUR = 10.752;
      tl.to(
        handPhase,
        {
          p: Math.PI * 2 * 3.2,
          duration: HAND_IDLE_DUR,
          ease: "none",
          onUpdate: () => {
            const dy = Math.sin(handPhase.p) * 1.5;
            document.getElementById("g6-hand-wrap").style.transform = `translate(calc(-50%), calc(-50% + ${dy}px))`;
          },
        },
        T.scene_7
      );

      window.__timelines["group_w6"] = tl;
    </script>
  </div>
</template>
