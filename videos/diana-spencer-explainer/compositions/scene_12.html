        emphasis: "power3.out",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 0.95,
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const SCENE_DURATION = 7;

      // ─── INITIAL HIDDEN STATES ───────────────────────────────────────────────
      // All arc lines and thumbnail sketches start invisible
      for (let i = 0; i <= 10; i++) {
        const arc = document.querySelector("#s12-arc-" + i);
        const sketch = document.querySelector("#s12-sketch-" + i);
        if (arc) gsap.set(arc, { opacity: 0 });
        if (sketch) gsap.set(sketch, { opacity: 0 });
      }

      // Blueprint letter paths start invisible + undone
      const bpPaths = document.querySelectorAll("[id^='s12-bp-']");
      bpPaths.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
      });
      gsap.set("#s12-blueprint-label", { opacity: 1 });

      // Center node, hero wrap, stamp all start hidden
      gsap.set("#s12-center-node", { opacity: 0, scale: 0.6 });
      gsap.set("#s12-hero-wrap", { opacity: 0 });
      gsap.set("#s12-stamp-wrap", { opacity: 0, scale: 1.12, rotation: -4 });

      // ─── SLOW PULL-BACK (macro camera) ──────────────────────────────────────
      // Scene starts slightly zoomed in (scale 1.08) and slowly pulls back to 1.0
      gsap.set("#s12-pullback", { scale: 1.08, transformOrigin: "50% 50%" });
      tl.to(
        "#s12-pullback",
        { scale: 1.0, duration: 6.5, ease: "power1.inOut" },
        0,
      );

      // ─── CENTER NODE ENTRY ───────────────────────────────────────────────────
      tl.fromTo(
        "#s12-center-node",
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: DUR.slow, ease: EASE.emphasis },
        0.15,
      );

      // ─── SVG-PATH-DRAW: thumbnail sketches appear staggered ─────────────────
      // 11 sketches in staggered sequence, total stagger ~450ms (0.04s/sketch)
      const SKETCH_STAGGER = 0.04;
      const SKETCH_DUR = 0.35;
      const SKETCH_START = 0.35;

      for (let i = 0; i <= 10; i++) {
        const sketchEl = document.querySelector("#s12-sketch-" + i);
        if (sketchEl) {
          // Fade sketch in (the internal paths are already drawn, we're doing a fade reveal)
          tl.fromTo(
            sketchEl,
            { opacity: 0, scale: 0.85 },
            { opacity: 1, scale: 1, duration: SKETCH_DUR, ease: EASE.entry },
            SKETCH_START + i * SKETCH_STAGGER,
          );
        }
      }

      // ─── CENTER-OUTWARD-EXPANSION: arc lines radiate from center ─────────────
      // Arc lines appear after sketches are in (at ~0.8s), radiating outward
      const ARC_START = 0.7;
      const ARC_STAGGER = 0.06;
      const ARC_DUR = 0.6;

      for (let i = 0; i <= 10; i++) {
        const arcEl = document.querySelector("#s12-arc-" + i);
        if (arcEl) {
          const arcLen = arcEl.getTotalLength ? arcEl.getTotalLength() : 400;
          arcEl.style.strokeDasharray = arcLen;
          arcEl.style.strokeDashoffset = arcLen;
          gsap.set(arcEl, { opacity: 1 });
          tl.to(
            arcEl,
            {
              strokeDashoffset: 0,
              duration: ARC_DUR,
              ease: EASE.entry,
            },
            ARC_START + i * ARC_STAGGER,
          );
        }
      }

      // ─── SVG-PATH-DRAW: "BLUEPRINT" label letters drawn sequentially ─────────
      // Blueprint label group becomes visible; letters draw one by one
      const BP_START = 2.0;
      const BP_SEG_DUR = 0.28;
      const BP_STAGGER = 0.22;

      bpPaths.forEach((p, i) => {
        tl.to(
          p,
          {
            strokeDashoffset: 0,
            duration: BP_SEG_DUR,
            ease: "power2.out",
          },
          BP_START + i * BP_STAGGER,
        );
      });

      // ─── HERO HEADLINE FADES IN after arc-draw settles ──────────────────────
      // Hero fades in at ~3.2s, sits at low opacity until the glow phase
      tl.fromTo(
        "#s12-hero-wrap",
        { opacity: 0 },
        { opacity: 0.35, duration: DUR.slow, ease: EASE.entry },
        3.2,
      );

      // ─── ASR-KEYWORD-GLOW: "playbook" and "still running" pulse at ~4.5s ───
      // Timings within the scene (local seconds)
      const TIMINGS = {
        "her":          { start: 3.8,  end: 4.1  },
        "playbook":     { start: 4.2,  end: 4.9  },
        "is":           { start: 5.0,  end: 5.2  },
        "still-running":{ start: 5.35, end: 6.2  },
      };

      const ATTACK_DUR  = 0.18;
      const RELEASE     = 0.35;
      const REST_LEVEL  = 0.12;
      const MAX_BLUR    = 38;
      const MAX_SCALE_BOOST = 0.18;

      // REST_RGB: dim brand-primary (muted)
      const REST_RGB   = { r: 31,  g: 58,  b: 138 };
      // ACTIVE_RGB: bright ink blue
      const ACTIVE_RGB = { r: 10,  g: 30,  b: 90  };
      // BRAND_RGB: crimson accent
      const BRAND_RGB  = { r: 194, g: 52,  b: 43  };

      function lerpChannel(a, b, t) {
        return Math.round(a + (b - a) * t);
      }
      function colorAt(env, isBrand) {
        const target = isBrand ? BRAND_RGB : ACTIVE_RGB;
        return "rgb(" +
          lerpChannel(REST_RGB.r, target.r, env) + "," +
          lerpChannel(REST_RGB.g, target.g, env) + "," +
          lerpChannel(REST_RGB.b, target.b, env) + ")";
      }
      function glowColorRgba(env, isBrand) {
        const alpha = 0.1 + env * 0.75;
        if (isBrand) return "rgba(194,52,43," + alpha + ")";
        return "rgba(31,58,138," + alpha + ")";
      }

      function envelope(time, start, end) {
        const releaseEnd = end + RELEASE;
        if (time < start) return 0;
        if (time < start + ATTACK_DUR) return (time - start) / ATTACK_DUR;
        if (time < end) return 1;
        if (time < releaseEnd) {
          const decay = (time - end) / RELEASE;
          return 1 - decay * (1 - REST_LEVEL);
        }
        return REST_LEVEL;
      }

      const wordEls = document.querySelectorAll(".s12-word");

      // Single driver for ASR glow: 0 → SCENE_DURATION
      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: SCENE_DURATION,
          duration: SCENE_DURATION,
          ease: "none",
          onUpdate: () => {
            // Hero wrap opacity: ramp from 0.35 to 1 as glow phase begins
            const heroPhase = Math.min(Math.max((driver.t - 3.8) / 0.6, 0), 1);
            const heroWrap = document.querySelector("#s12-hero-wrap");
            if (heroWrap) heroWrap.style.opacity = 0.35 + heroPhase * 0.65;

            wordEls.forEach((el) => {
              const word = el.dataset.word;
              const timing = TIMINGS[word];
              if (!timing) return;
              const env = envelope(driver.t, timing.start, timing.end);
              const isBrand = el.classList.contains("s12-brand");
              const blur = MAX_BLUR * env;
              const scale = 1 + MAX_SCALE_BOOST * env;
              el.style.textShadow = "0 0 " + blur + "px " + glowColorRgba(env, isBrand);
              el.style.transform = "scale(" + scale + ")";
              el.style.color = colorAt(env, isBrand);
            });
          },
        },
        0,
      );

      // ─── CLOSING STAMP: slam in at lower right at ~5.5s ─────────────────────
      // Stamp scale-slams in at -4deg (CSS already has the tilt via var(--tilt-stamp))
      tl.fromTo(
        "#s12-stamp-wrap",
        { opacity: 0, scale: 1.12 },
        { opacity: 1, scale: 1, rotation: -4, duration: DUR.snap, ease: EASE.emphasis },
        5.5,
      );

      // ─── SETTLE + HOLD from ~5.7s → 7s ─────────────────────────────────────
      // Nothing more animates; everything holds the final frame.

      window.__timelines["scene_12"] = tl;
    </script>
  </div>
</template>
