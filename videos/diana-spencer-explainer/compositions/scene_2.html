<template id="scene_2-template">
  <div id="root" class="scene_2-root" data-composition-id="scene_2" data-width="1920" data-height="1080" data-duration="6" style="position:relative; width:1920px; height:1080px; overflow:hidden;">
    <style>
      @font-face { font-family: 'Space Grotesk'; src: url('../public/space-grotesk-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: 'Space Grotesk'; src: url('../public/space-grotesk-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
      @font-face { font-family: 'Caveat'; src: url('../public/caveat-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: 'Caveat'; src: url('../public/caveat-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
      :root {
        --font-body: 'Space Grotesk', system-ui, sans-serif;
        --font-display: 'Space Grotesk', system-ui, sans-serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
        --font-script: 'Caveat', cursive;
      }
      #root {
        background: var(--canvas);
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
      #root *,
      #root *::before,
      #root *::after {
        box-sizing: border-box;
      }

      /* ── Paper grain overlay ── */
      .s2-paper-grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        opacity: 0.35;
        mix-blend-mode: multiply;
        background-image: var(--paper-grain);
      }

      /* ── Camera drift wrapper ── */
      .s2-stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        z-index: 2;
        will-change: transform;
      }

      /* ── Left column: dual family tree (65% width) ── */
      .s2-tree-col {
        position: relative;
        width: 65%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 60px 48px 60px 80px;
      }

      /* ── Right column: label panel (35% width) ── */
      .s2-label-col {
        position: relative;
        width: 35%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 60px 64px 60px 40px;
        border-left: 1.5px solid color-mix(in srgb, var(--brand-primary) 20%, transparent);
      }

      /* ── SVG family tree ── */
      .s2-tree-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* ── Tree path base styles ── */
      .s2-tree-path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .s2-windsor-path {
        stroke: var(--brand-primary);
        stroke-width: 2.5;
      }
      .s2-spencer-path {
        stroke: var(--brand-primary);
        stroke-width: 3.5;
      }
      .s2-connector-path {
        stroke: var(--brand-primary);
        stroke-width: 2;
        stroke-dasharray: 6 5;
      }

      /* ── Node glyphs ── */
      .s2-node {
        fill: var(--canvas);
        stroke: var(--brand-primary);
        stroke-width: 2.5;
      }
      .s2-node-marriage {
        fill: var(--canvas);
        stroke: var(--brand-primary);
        stroke-width: 3;
        will-change: transform;
      }
      .s2-node-label {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        fill: var(--brand-primary);
      }
      .s2-node-label-sm {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        fill: var(--brand-primary);
        opacity: 0.75;
      }
      .s2-lineage-header {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        fill: var(--brand-primary);
        opacity: 0.9;
      }
      .s2-year-label {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.1em;
        fill: var(--brand-accent);
      }

      /* ── Right-panel text elements ── */
      .s2-eyebrow {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--brand-primary);
        opacity: 0.75;
        margin-bottom: 28px;
        line-height: 1.5;
      }

      .s2-caption-block {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 16px;
      }

      .s2-caption-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
        opacity: 0;
      }

      .s2-caption-year {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: 0.12em;
        color: var(--brand-accent);
        line-height: 1;
      }

      .s2-caption-text {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--brand-primary);
        line-height: 1.4;
        opacity: 0.85;
      }

      .s2-caption-divider {
        width: 48px;
        height: 1.5px;
        background: var(--brand-primary);
        opacity: 0.3;
        margin: 4px 0;
      }

      /* ── Marriage node heartbeat target ── */
      .s2-marriage-glyph {
        will-change: transform;
        transform-origin: 50% 50%;
      }
    </style>

    <!-- Paper grain atmospheric layer -->
    <div class="s2-paper-grain" aria-hidden="true"></div>

    <!-- Main stage (camera drift) -->
    <div class="s2-stage" id="s2-stage" data-layout-role="primary" data-layout-act="family-tree">

      <!-- LEFT: dual SVG family tree (65% width) -->
      <div class="s2-tree-col" data-layout-role="primary">
        <!--
          SVG viewBox: 0 0 760 900
          Windsor lineage: x=140 (left trunk)
          Spencer lineage: x=560 (right trunk, taller/older)
          Marriage connector: horizontal dashed at y≈640
          Nodes cascade top→bottom; Spencer starts higher (earlier century)
        -->
        <svg class="s2-tree-svg" viewBox="0 0 760 900" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

          <!-- ═══════════════════════════════════════════
               SPENCER LINEAGE (right trunk) — TALLER / OLDER
               Starts at y=30, ends at y=660
               Firmer ink weight (stroke-width 3.5)
          ═══════════════════════════════════════════ -->

          <!-- Spencer header label -->
          <text class="s2-lineage-header" id="s2-spencer-header" x="490" y="22" text-anchor="middle" opacity="0">Spencer</text>

          <!-- Spencer trunk: top to marriage -->
          <path id="s2-sp-trunk-upper" class="s2-tree-path s2-spencer-path"
            d="M 490 30 L 490 640" />

          <!-- Spencer branch 1 (c.1500 Tudor era) — horizontal branch left -->
          <path id="s2-sp-b1" class="s2-tree-path s2-spencer-path"
            d="M 490 80 L 430 80" />
          <!-- Spencer branch 2 -->
          <path id="s2-sp-b2" class="s2-tree-path s2-spencer-path"
            d="M 490 200 L 430 200" />
          <!-- Spencer branch 3 -->
          <path id="s2-sp-b3" class="s2-tree-path s2-spencer-path"
            d="M 490 320 L 430 320" />
          <!-- Spencer branch 4 -->
          <path id="s2-sp-b4" class="s2-tree-path s2-spencer-path"
            d="M 490 440 L 430 440" />
          <!-- Spencer branch 5 -->
          <path id="s2-sp-b5" class="s2-tree-path s2-spencer-path"
            d="M 490 560 L 430 560" />

          <!-- Spencer nodes -->
          <circle class="s2-node" id="s2-sp-n1" cx="430" cy="80"  r="7" opacity="0" />
          <circle class="s2-node" id="s2-sp-n2" cx="430" cy="200" r="7" opacity="0" />
          <circle class="s2-node" id="s2-sp-n3" cx="430" cy="320" r="7" opacity="0" />
          <circle class="s2-node" id="s2-sp-n4" cx="430" cy="440" r="7" opacity="0" />
          <circle class="s2-node" id="s2-sp-n5" cx="430" cy="560" r="7" opacity="0" />

          <!-- Spencer node labels (stagger in via dynamic-content-sequencing) -->
          <text class="s2-node-label" id="s2-sp-l1" x="414" y="75" text-anchor="end" opacity="0">c. 1508</text>
          <text class="s2-node-label" id="s2-sp-l2" x="414" y="195" text-anchor="end" opacity="0">c. 1620</text>
          <text class="s2-node-label" id="s2-sp-l3" x="414" y="315" text-anchor="end" opacity="0">c. 1734</text>
          <text class="s2-node-label" id="s2-sp-l4" x="414" y="435" text-anchor="end" opacity="0">c. 1830</text>
          <text class="s2-node-label" id="s2-sp-l5" x="414" y="555" text-anchor="end" opacity="0">c. 1924</text>

          <!-- Spencer year glyphs (accent crimson) — stagger in -->
          <text class="s2-year-label" id="s2-sp-y1" x="498" y="75" opacity="0">500 yrs.</text>
          <text class="s2-year-label" id="s2-sp-y2" x="498" y="195" opacity="0">Tudor era</text>
          <text class="s2-year-label" id="s2-sp-y3" x="498" y="315" opacity="0">Dukes</text>
          <text class="s2-year-label" id="s2-sp-y4" x="498" y="435" opacity="0">Earldom</text>
          <text class="s2-year-label" id="s2-sp-y5" x="498" y="555" opacity="0">Diana's father</text>

          <!-- ═══════════════════════════════════════════
               WINDSOR LINEAGE (left trunk)
               Starts at y=200 (shorter — post 1917), ends at y=660
               Standard ink weight (stroke-width 2.5)
          ═══════════════════════════════════════════ -->

          <!-- Windsor header label -->
          <text class="s2-lineage-header" id="s2-windsor-header" x="200" y="192" text-anchor="middle" opacity="0">Windsor</text>

          <!-- Windsor trunk: from 1917 name-change down to marriage -->
          <path id="s2-win-trunk" class="s2-tree-path s2-windsor-path"
            d="M 200 200 L 200 640" />

          <!-- Windsor branch 1 (1917 name-change) -->
          <path id="s2-win-b1" class="s2-tree-path s2-windsor-path"
            d="M 200 280 L 270 280" />
          <!-- Windsor branch 2 -->
          <path id="s2-win-b2" class="s2-tree-path s2-windsor-path"
            d="M 200 390 L 270 390" />
          <!-- Windsor branch 3 -->
          <path id="s2-win-b3" class="s2-tree-path s2-windsor-path"
            d="M 200 510 L 270 510" />

          <!-- Windsor nodes -->
          <circle class="s2-node" id="s2-win-n1" cx="270" cy="280" r="7" opacity="0" />
          <circle class="s2-node" id="s2-win-n2" cx="270" cy="390" r="7" opacity="0" />
          <circle class="s2-node" id="s2-win-n3" cx="270" cy="510" r="7" opacity="0" />

          <!-- Windsor node labels -->
          <text class="s2-node-label" id="s2-win-l1" x="285" y="275" text-anchor="start" opacity="0">1917</text>
          <text class="s2-node-label" id="s2-win-l2" x="285" y="385" text-anchor="start" opacity="0">George VI</text>
          <text class="s2-node-label" id="s2-win-l3" x="285" y="505" text-anchor="start" opacity="0">Charles</text>

          <!-- Windsor year accent labels -->
          <text class="s2-year-label" id="s2-win-y1" x="122" y="275" text-anchor="end" opacity="0">Name change</text>
          <text class="s2-year-label" id="s2-win-y2" x="122" y="385" text-anchor="end" opacity="0">1936</text>
          <text class="s2-year-label" id="s2-win-y3" x="122" y="505" text-anchor="end" opacity="0">1981</text>

          <!-- ═══════════════════════════════════════════
               MARRIAGE CONNECTOR — horizontal dashed bridge
          ═══════════════════════════════════════════ -->
          <path id="s2-connector" class="s2-tree-path s2-connector-path"
            d="M 200 640 L 490 640" />

          <!-- Marriage node glyph — the "live" breathing element -->
          <g id="s2-marriage-node" class="s2-marriage-glyph" opacity="0">
            <circle class="s2-node-marriage" cx="345" cy="640" r="14" />
            <text class="s2-node-label" x="345" y="644" text-anchor="middle" dominant-baseline="middle" font-size="9">♥</text>
            <text class="s2-node-label-sm" x="345" y="662" text-anchor="middle">1981</text>
          </g>

          <!-- ═══════════════════════════════════════════
               Diana leaf node — terminus
          ═══════════════════════════════════════════ -->
          <path id="s2-diana-stem" class="s2-tree-path s2-spencer-path"
            d="M 490 640 L 490 740" />
          <circle class="s2-node" id="s2-diana-node" cx="490" cy="740" r="10" opacity="0" />
          <text class="s2-node-label" id="s2-diana-label" x="508" y="736" text-anchor="start" opacity="0" font-size="13" font-weight="600">Diana</text>
          <text class="s2-node-label-sm" id="s2-diana-year" x="508" y="752" text-anchor="start" opacity="0">b. 1961</text>

          <!-- Vertical hairline rule: visual separator between lineages -->
          <line x1="345" y1="40" x2="345" y2="800" stroke="var(--brand-primary)" stroke-width="0.8" opacity="0.12" />

        </svg>
      </div>

      <!-- RIGHT: label/caption panel (35% width) -->
      <div class="s2-label-col" data-layout-role="supporting">

        <!-- Eyebrow mono tag -->
        <div class="s2-eyebrow" id="s2-eyebrow">Tudor Lineage<br>/ 500 Yrs.</div>

        <!-- Sequenced caption items -->
        <div class="s2-caption-block" id="s2-caption-block">

          <div class="s2-caption-item" id="s2-ci-1">
            <div class="s2-caption-year">c. 1508</div>
            <div class="s2-caption-divider"></div>
            <div class="s2-caption-text">Spencer family<br>documented</div>
          </div>

          <div class="s2-caption-item" id="s2-ci-2">
            <div class="s2-caption-year">1917</div>
            <div class="s2-caption-divider"></div>
            <div class="s2-caption-text">Windsors<br>rename<br>themselves</div>
          </div>

          <div class="s2-caption-item" id="s2-ci-3">
            <div class="s2-caption-year">1981</div>
            <div class="s2-caption-divider"></div>
            <div class="s2-caption-text">The older<br>bloodline<br>marries in</div>
          </div>

        </div>

      </div>

    </div><!-- /.s2-stage -->

    <script>
      const EASE = {
        entry: "power2.out",
        emphasis: "power3.out",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 0.95,
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ─── Measure all SVG paths for svg-path-draw ───────────────────────────
      const drawPaths = document.querySelectorAll(
        "#s2-sp-trunk-upper, #s2-sp-b1, #s2-sp-b2, #s2-sp-b3, #s2-sp-b4, #s2-sp-b5," +
        "#s2-win-trunk, #s2-win-b1, #s2-win-b2, #s2-win-b3," +
        "#s2-connector, #s2-diana-stem"
      );
      drawPaths.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      // ─── INITIAL HIDDEN STATES ─────────────────────────────────────────────
      // (per cheat-sheet #2 — gsap.set, not CSS opacity:0)
      gsap.set("#s2-spencer-header", { opacity: 0 });
      gsap.set("#s2-windsor-header", { opacity: 0 });
      gsap.set("#s2-eyebrow", { opacity: 0, y: -12 });
      gsap.set("#s2-marriage-node", { opacity: 0 });
      gsap.set("#s2-diana-node, #s2-diana-label, #s2-diana-year", { opacity: 0 });
      // caption items hidden
      gsap.set("#s2-ci-1, #s2-ci-2, #s2-ci-3", { opacity: 0, y: 10 });
      // Spencer node circles + labels
      gsap.set(
        "#s2-sp-n1, #s2-sp-n2, #s2-sp-n3, #s2-sp-n4, #s2-sp-n5," +
        "#s2-sp-l1, #s2-sp-l2, #s2-sp-l3, #s2-sp-l4, #s2-sp-l5," +
        "#s2-sp-y1, #s2-sp-y2, #s2-sp-y3, #s2-sp-y4, #s2-sp-y5",
        { opacity: 0 }
      );
      // Windsor node circles + labels
      gsap.set(
        "#s2-win-n1, #s2-win-n2, #s2-win-n3," +
        "#s2-win-l1, #s2-win-l2, #s2-win-l3," +
        "#s2-win-y1, #s2-win-y2, #s2-win-y3",
        { opacity: 0 }
      );

      // ─── PHASE 0 (0s–0.2s): eyebrow appears ───────────────────────────────
      tl.fromTo(
        "#s2-eyebrow",
        { opacity: 0, y: -12 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry },
        0
      );

      // ─── PHASE 1 (0.1s–1.8s): SVG-PATH-DRAW — Spencer trunk (taller/older, draws first) ──
      tl.fromTo(
        "#s2-spencer-header",
        { opacity: 0 },
        { opacity: 1, duration: DUR.snap * 2, ease: EASE.entry },
        0.1
      );
      tl.to("#s2-sp-trunk-upper", {
        strokeDashoffset: 0,
        duration: 1.0,
        ease: "power2.out",
      }, 0.15);

      // Spencer branches draw sequentially (stagger ~70% of 0.25s)
      tl.to("#s2-sp-b1", { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, 0.35);
      tl.to("#s2-sp-b2", { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, 0.55);
      tl.to("#s2-sp-b3", { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, 0.75);
      tl.to("#s2-sp-b4", { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, 0.95);
      tl.to("#s2-sp-b5", { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, 1.15);

      // Spencer nodes pop in behind branch draws
      tl.to("#s2-sp-n1", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 0.55);
      tl.to("#s2-sp-n2", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 0.75);
      tl.to("#s2-sp-n3", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 0.95);
      tl.to("#s2-sp-n4", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 1.15);
      tl.to("#s2-sp-n5", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 1.35);

      // ─── PHASE 2 (0.8s–2.2s): SVG-PATH-DRAW — Windsor trunk (shorter, draws after) ──
      tl.fromTo(
        "#s2-windsor-header",
        { opacity: 0 },
        { opacity: 1, duration: DUR.snap * 2, ease: EASE.entry },
        0.8
      );
      tl.to("#s2-win-trunk", {
        strokeDashoffset: 0,
        duration: 0.7,
        ease: "power2.out",
      }, 0.85);

      tl.to("#s2-win-b1", { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 1.05);
      tl.to("#s2-win-b2", { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 1.25);
      tl.to("#s2-win-b3", { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 1.45);

      tl.to("#s2-win-n1", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 1.22);
      tl.to("#s2-win-n2", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 1.42);
      tl.to("#s2-win-n3", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 1.62);

      // ─── PHASE 3 (1.6s–2.0s): dashed connector draws across ──────────────
      tl.to("#s2-connector", {
        strokeDashoffset: 0,
        duration: 0.55,
        ease: "power2.out",
      }, 1.65);

      // Marriage node appears at connector midpoint
      tl.to("#s2-marriage-node", {
        opacity: 1,
        duration: DUR.snap,
        ease: EASE.entry,
      }, 2.15);

      // ─── PHASE 4 (2.0s–2.6s): Diana stem + leaf node ─────────────────────
      tl.to("#s2-diana-stem", {
        strokeDashoffset: 0,
        duration: 0.35,
        ease: "power2.out",
      }, 2.1);
      tl.to("#s2-diana-node", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 2.4);
      tl.to("#s2-diana-label, #s2-diana-year", { opacity: 1, duration: DUR.med, ease: EASE.entry }, 2.45);

      // ─── PHASE 5 (DYNAMIC-CONTENT-SEQUENCING): Year labels stagger in ─────
      // Spencer labels (odd century, older) — stagger starting at 1.0s
      tl.to("#s2-sp-l1, #s2-sp-y1", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 1.0);
      tl.to("#s2-sp-l2, #s2-sp-y2", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 1.3);
      tl.to("#s2-sp-l3, #s2-sp-y3", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 1.6);
      tl.to("#s2-sp-l4, #s2-sp-y4", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 1.9);
      tl.to("#s2-sp-l5, #s2-sp-y5", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 2.15);

      // Windsor labels — stagger starting at 1.5s
      tl.to("#s2-win-l1, #s2-win-y1", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 1.5);
      tl.to("#s2-win-l2, #s2-win-y2", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 1.75);
      tl.to("#s2-win-l3, #s2-win-y3", { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 2.0);

      // Right-panel caption cards sequence in (dynamic-content-sequencing pacing)
      // Item 1: Spencer c.1508 — appears at 1.1s
      tl.fromTo(
        "#s2-ci-1",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry },
        1.1
      );
      // Item 2: Windsor 1917 — appears at 1.8s
      tl.fromTo(
        "#s2-ci-2",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry },
        1.8
      );
      // Item 3: Marriage 1981 — appears at 2.5s
      tl.fromTo(
        "#s2-ci-3",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry },
        2.5
      );

      // ─── PHASE 6 (2.6s–6s): SINE-WAVE-LOOP — marriage node glyph breathes ─
      // Single live idle slot: the marriage node at the bridge
      // IDLE_START_TIME = 2.6s (after connector + node appear)
      // IDLE_DUR = 6 - 2.6 = 3.4s
      // CYCLES = 3.4 / 2.8 ≈ 1.2 (one comfortable breath of ~2.8s)
      // SCALE_AMP = 0.025 (single isolated element, short scene)
      // Y_AMP_PX = 2.5px
      const marriageNode = document.getElementById("s2-marriage-node");
      const nodePhase = { p: 0 };
      tl.to(

          p: Math.PI * 2 * 1.2,
          duration: 3.4,
          ease: "none",
          onUpdate: () => {
            const scaleVal = 1 + Math.sin(nodePhase.p) * 0.025;
            const yVal = Math.sin(nodePhase.p) * 2.5;
            marriageNode.style.transform = "translateY(" + yVal + "px) scale(" + scaleVal + ")";
          },
        },
        2.6
      );

      // ─── MACRO CAMERA: slow drift left-to-right via stage translate ────────
      // Budget: ONE root-level macro move. Stage drifts x: 0 → -18px over 6s.
      tl.fromTo(
        "#s2-stage",
        { x: 0 },
        { x: -18, duration: 6, ease: "none" },
        0
      );

      window.__timelines["scene_2"] = tl;
    </script>
