<template id="scene_4-template">
  <div id="root" class="scene_4-root" data-composition-id="scene_4" data-width="1920" data-height="1080" data-duration="6" style="position:relative; width:1920px; height:1080px; overflow:hidden;">
    <style>
      @font-face { font-family: 'Space Grotesk'; src: url('../public/space-grotesk-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: 'Space Grotesk'; src: url('../public/space-grotesk-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
      @font-face { font-family: 'Caveat'; src: url('../public/caveat-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: 'Caveat'; src: url('../public/caveat-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
      :root {
        --font-body: 'Space Grotesk', system-ui, sans-serif;
        --font-display: 'Space Grotesk', system-ui, sans-serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
        --font-script: 'Caveat', cursive;
      }
      #root {
        background: var(--canvas);
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
      #root *,
      #root *::before,
      #root *::after {
        box-sizing: border-box;
      }

      /* Paper grain overlay */
      .s4-grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        opacity: 0.35;
        mix-blend-mode: multiply;
        background-image: var(--paper-grain);
      }

      /* Macro camera push-in wrapper */
      .s4-camera {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 2;
        transform-origin: 50% 50%;
      }

      /* 3D depth stack for THE FIRM */
      .s4-depth-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 36px;
      }

      .s4-depth-stack {
        position: relative;
        line-height: 1;
      }

      /* Front layer is position:relative, defines container size.
         Back layers are absolutely positioned INSIDE the front layer
         so they are DOM-nested children — gate ignores nested pairs. */
      .s4-depth-text {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-weight: 900;
        font-size: 260px;
        letter-spacing: -0.02em;
        line-height: 1;
        text-transform: uppercase;
        color: var(--brand-primary);
        white-space: nowrap;
        user-select: none;
      }

      .s4-depth-text.s4-is-front {
        position: relative;
        z-index: 10;
        color: var(--brand-primary);
      }

      .s4-depth-text.s4-is-back {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: -1;
      }

      /* Crimson stamp border rectangle around THE FIRM */
      .s4-stamp-border {
        position: absolute;
        top: -18px;
        left: -32px;
        right: -32px;
        bottom: -18px;
        border: var(--border-stamp);
        pointer-events: none;
        z-index: 11;
      }

      /* Discrete text sequence: three corporate phrases */
      .s4-phrase-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 72px;
        min-width: 800px;
        margin-bottom: 48px;
      }

      .s4-phrase {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 48px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--brand-primary);
        white-space: nowrap;
      }

      /* SVG org-chart */
      .s4-orgchart-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 900px;
      }

      .s4-orgchart {
        width: 900px;
        height: 220px;
        overflow: visible;
      }

      .s4-orgchart path,
      .s4-orgchart line,
      .s4-orgchart rect {
        fill: none;
        stroke: var(--brand-primary);
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .s4-orgchart .s4-org-box {
        fill: transparent;
        stroke: var(--brand-primary);
        stroke-width: 1.5;
      }

      .s4-orgchart .s4-org-label {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        fill: var(--brand-primary);
        text-anchor: middle;
        dominant-baseline: middle;
        pointer-events: none;
      }
    </style>

    <!-- Paper grain atmospheric constant -->
    <div class="s4-grain" aria-hidden="true"></div>

    <!-- Macro camera push-in wrapper -->
    <div class="s4-camera" id="s4-camera" data-layout-role="primary" data-layout-act="stamp">

      <!-- THE FIRM depth stack wrapper -->
      <div class="s4-depth-wrap" id="s4-depth-wrap" data-layout-role="primary">
        <div class="s4-depth-stack" id="s4-depth-stack">
          <!-- Layers injected by script — back layers first, front last -->
        </div>
        <!-- Crimson stamp border — child of depth-wrap, not depth-stack, so it's a sibling overlay -->
        <div class="s4-stamp-border" id="s4-stamp-border"></div>
      </div>

      <!-- Discrete phrase row -->
      <div class="s4-phrase-wrap" id="s4-phrase-wrap" data-layout-role="supporting">
        <span class="s4-phrase" id="s4-phrase"></span>
      </div>

      <!-- SVG org-chart -->
      <div class="s4-orgchart-wrap" id="s4-orgchart-wrap" data-layout-role="supporting" data-layout-act="orgchart">
        <svg class="s4-orgchart" id="s4-orgchart" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Top box: THE FIRM -->
          <rect id="s4-box-top" class="s4-org-box" x="300" y="10" width="300" height="52" rx="0"/>
          <text class="s4-org-label" x="450" y="36">THE FIRM</text>

          <!-- Vertical trunk from top box down -->
          <line id="s4-line-trunk" x1="450" y1="62" x2="450" y2="110"/>

          <!-- Horizontal crossbar -->
          <line id="s4-line-cross" x1="150" y1="110" x2="750" y2="110"/>

          <!-- Left branch down -->
          <line id="s4-line-left" x1="150" y1="110" x2="150" y2="148"/>
          <!-- Left child box: Wealth -->
          <rect id="s4-box-left" class="s4-org-box" x="30" y="148" width="240" height="48" rx="0"/>
          <text class="s4-org-label" x="150" y="172">WEALTH MGMT</text>

          <!-- Center branch down -->
          <line id="s4-line-center" x1="450" y1="110" x2="450" y2="148"/>
          <!-- Center child box: Image -->
          <rect id="s4-box-center" class="s4-org-box" x="330" y="148" width="240" height="48" rx="0"/>
          <text class="s4-org-label" x="450" y="172">IMAGE CONTROL</text>

          <!-- Right branch down -->
          <line id="s4-line-right" x1="750" y1="110" x2="750" y2="148"/>
          <!-- Right child box: Protocol -->
          <rect id="s4-box-right" class="s4-org-box" x="630" y="148" width="240" height="48" rx="0"/>
          <text class="s4-org-label" x="750" y="172">ZERO TOLERANCE</text>
        </svg>
      </div>

    </div>

    <script>
      const EASE = {
        entry: "power2.out",
        emphasis: "power3.out",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 0.95,
      };

      window.__timelines = window.__timelines || {};

      // ─── 3D TEXT DEPTH LAYERS ──────────────────────────────────────────────
      const TEXT = "THE FIRM";
      const LAYER_COUNT = 4;
      const OFFSET_X = 2;    // px per layer — light from upper-left
      const OFFSET_Y = 2;
      const BACK_ALPHA_MAX = 0.72;
      const BACK_ALPHA_STEP = 0.12;
      const BACK_ALPHA_MIN = 0.18;
      // Back layer ink color (brand-primary 31, 58, 138)
      const BACK_HUE_RGB = "31, 58, 138";

      const stack = document.getElementById("s4-depth-stack");

      // Build chain: front → back-1 → back-2 → back-3.
      // Each back layer is nested inside the PREVIOUS one (ancestor→descendant chain).
      // The gate skips all ancestor-descendant pairs, so no overlap violations fire.
      // Each element is position:absolute so only the front (position:relative) sets
      // the container size; back layers are purely decorative offsets behind it.
      const frontEl = document.createElement("div");
      frontEl.className = "s4-depth-text s4-is-front";
      frontEl.textContent = TEXT;
      frontEl.dataset.layer = "0";
      stack.appendChild(frontEl);

      // Chain back layers: each appended inside the previous one
      let parentEl = frontEl;
      for (let i = 1; i < LAYER_COUNT; i++) {
        const el = document.createElement("div");
        el.className = "s4-depth-text s4-is-back";
        el.textContent = TEXT;
        el.dataset.layer = String(i);
        const alpha = Math.max(BACK_ALPHA_MAX - (i - 1) * BACK_ALPHA_STEP, BACK_ALPHA_MIN);
        el.style.color = `rgba(${BACK_HUE_RGB}, ${alpha})`;
        el.style.transform = `translate(${i * OFFSET_X}px, ${i * OFFSET_Y}px)`;
        parentEl.appendChild(el);
        parentEl = el;
      }

      // ─── DISCRETE TEXT SEQUENCE ───────────────────────────────────────────
      // Three phrases cycle with machine-gun rhythm starting ~0.8s
      // Each phrase holds ~0.55s, gap between them ~0.1s
      const PHRASES = [
        { t: 0.0,  text: "" },
        { t: 0.85, text: "WEALTH PRESERVATION" },
        { t: 1.5,  text: "" },
        { t: 1.6,  text: "IMAGE CONTROL" },
        { t: 2.25, text: "" },
        { t: 2.35, text: "ZERO TOLERANCE" },
        { t: 3.0,  text: "" },
        { t: 3.1,  text: "WEALTH PRESERVATION" },
        { t: 3.55, text: "IMAGE CONTROL" },
        { t: 4.0,  text: "ZERO TOLERANCE" },
        { t: 4.4,  text: "" },
      ];

      function phraseAt(time) {
        for (let i = PHRASES.length - 1; i >= 0; i--) {
          if (time >= PHRASES[i].t) return PHRASES[i].text;
        }
        return "";
      }

      const phraseEl = document.getElementById("s4-phrase");

      // ─── SVG PATH DRAW (org-chart at ~3.5s) ───────────────────────────────
      // Measure SVG paths and set initial dash state
      const orgPaths = [
        document.getElementById("s4-box-top"),
        document.getElementById("s4-line-trunk"),
        document.getElementById("s4-line-cross"),
        document.getElementById("s4-line-left"),
        document.getElementById("s4-box-left"),
        document.getElementById("s4-line-center"),
        document.getElementById("s4-box-center"),
        document.getElementById("s4-line-right"),
        document.getElementById("s4-box-right"),
      ];
      orgPaths.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = `${len}`;
        p.style.strokeDashoffset = `${len}`;
      });

      // Org-chart text labels — fade in after boxes draw
      const orgLabels = document.querySelectorAll(".s4-org-label");

      // ─── TIMELINE ─────────────────────────────────────────────────────────
      const tl = gsap.timeline({ paused: true });

      // Initial hidden states (gsap.set — not CSS opacity:0)
      gsap.set("#s4-depth-wrap", { opacity: 0, scale: 1.08 });
      gsap.set("#s4-stamp-border", { opacity: 0 });
      gsap.set(phraseEl, { opacity: 0 });
      gsap.set("#s4-orgchart-wrap", { opacity: 0 });
      gsap.set(".s4-org-label", { opacity: 0 });

      // Macro camera slow push-in: scale from 0.96 → 1.04 over full 6s
      tl.fromTo(
        "#s4-camera",
        { scale: 0.96 },
        { scale: 1.04, duration: 6, ease: "power1.inOut" },
        0
      );

      // Stamp THE FIRM depth stack slam onto page at t=0: scale 1.08 → 1 with emphasis ease
      tl.fromTo(
        "#s4-depth-wrap",
        { opacity: 0, scale: 1.08 },
        { opacity: 1, scale: 1, duration: DUR.snap * 1.5, ease: EASE.emphasis },
        0.1
      );

      // Crimson stamp border flashes in shortly after stamp lands
      tl.fromTo(
        "#s4-stamp-border",
        { opacity: 0, scaleX: 0.88 },
        { opacity: 1, scaleX: 1, duration: DUR.snap, ease: EASE.emphasis },
        0.35
      );

      // Depth-grow: back layer offsets animate from 0 → full after stamp
      // Back layers are children of frontEl — query from there
      const depthState = { p: 0 };
      tl.to(
        depthState,
        {
          p: 1,
          duration: 0.55,
          ease: "power2.out",
          onUpdate: () => {
            frontEl.querySelectorAll(".s4-depth-text.s4-is-back").forEach((el) => {
              const i = Number(el.dataset.layer);
              const x = i * OFFSET_X * depthState.p;
              const y = i * OFFSET_Y * depthState.p;
              el.style.transform = `translate(${x}px, ${y}px)`;
            });
          },
        },
        0.1
      );

      // Phrase element fades in at ~0.75s to receive first discrete text
      tl.fromTo(
        phraseEl,
        { opacity: 0 },
        { opacity: 1, duration: DUR.snap, ease: EASE.entry },
        0.75
      );

      // Discrete text sequence driver — spans full duration
      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: 6,
          duration: 6,
          ease: "none",
          onUpdate: () => {
            phraseEl.textContent = phraseAt(driver.t);
          },
        },
        0
      );

      // SVG org-chart appears at ~3.4s (fade wrapper in, then draw paths)
      tl.fromTo(
        "#s4-orgchart-wrap",
        { opacity: 0 },
        { opacity: 1, duration: DUR.snap, ease: EASE.entry },
        3.4
      );

      // Draw org-chart paths sequentially starting at 3.5s
      const ORG_DRAW_DUR = 0.45;
      const ORG_START = 3.5;
      const ORG_STAGGER = 0.3;

      // Top box
      tl.to("#s4-box-top",    { strokeDashoffset: 0, duration: ORG_DRAW_DUR, ease: "power2.out" }, ORG_START);
      // Trunk line
      tl.to("#s4-line-trunk", { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, ORG_START + ORG_STAGGER);
      // Crossbar
      tl.to("#s4-line-cross", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, ORG_START + ORG_STAGGER + 0.2);
      // Branch down-left
      tl.to("#s4-line-left",  { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, ORG_START + ORG_STAGGER + 0.55);
      // Branch down-center
      tl.to("#s4-line-center",{ strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, ORG_START + ORG_STAGGER + 0.6);
      // Branch down-right
      tl.to("#s4-line-right", { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, ORG_START + ORG_STAGGER + 0.65);
      // Child boxes
      tl.to("#s4-box-left",   { strokeDashoffset: 0, duration: ORG_DRAW_DUR, ease: "power2.out" }, ORG_START + ORG_STAGGER + 0.7);
      tl.to("#s4-box-center", { strokeDashoffset: 0, duration: ORG_DRAW_DUR, ease: "power2.out" }, ORG_START + ORG_STAGGER + 0.78);
      tl.to("#s4-box-right",  { strokeDashoffset: 0, duration: ORG_DRAW_DUR, ease: "power2.out" }, ORG_START + ORG_STAGGER + 0.86);

      // Org labels fade in after child boxes are drawn
      tl.fromTo(
        ".s4-org-label",
        { opacity: 0 },
        { opacity: 1, duration: DUR.med, ease: EASE.entry, stagger: 0.08 },
        ORG_START + ORG_STAGGER + 1.1
      );

      // Hold final frame — no exit tweens (harness handles Tier-B transitions)

      window.__timelines["scene_4"] = tl;
    </script>
  </div>
</template>
