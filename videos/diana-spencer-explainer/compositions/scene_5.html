<template id="scene_5-template">
  <div id="root" class="scene_5-root" data-composition-id="scene_5" data-width="1920" data-height="1080" data-duration="6" style="position:relative; width:1920px; height:1080px; overflow:hidden;">
    <style>
      @font-face { font-family: 'Space Grotesk'; src: url('../public/space-grotesk-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: 'Space Grotesk'; src: url('../public/space-grotesk-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
      @font-face { font-family: 'Caveat'; src: url('../public/caveat-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: 'Caveat'; src: url('../public/caveat-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
      :root {
        --font-body: 'Space Grotesk', system-ui, sans-serif;
        --font-display: 'Space Grotesk', system-ui, sans-serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
        --font-script: 'Caveat', cursive;
      }
      #root {
        background: var(--canvas);
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
      #root *,
      #root *::before,
      #root *::after {
        box-sizing: border-box;
      }

      /* ── Macro camera wrapper ── */
      .s5-camera {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* ── Split stage ── */
      .s5-stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        padding: 80px var(--pad-edge);
        perspective: 1800px;
      }

      /* ── LEFT CARD — 70%, large, ink silhouette ── */
      .s5-card-left {
        flex: 0 0 auto;
        width: 1120px;
        height: 840px;
        background: var(--surface-cream);
        border: var(--border-hairline);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-pin-hero);
        position: relative;
        overflow: hidden;
        transform-style: preserve-3d;
        will-change: transform;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 36px 40px 48px;
      }

      /* ── RIGHT CARD — 30%, small, label list ── */
      .s5-card-right {
        flex: 0 0 auto;
        width: 480px;
        height: 840px;
        background: var(--surface-cream);
        border: var(--border-hairline);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-pin-hero);
        position: relative;
        transform-style: preserve-3d;
        will-change: transform;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0;
        padding: 48px 36px;
      }

      /* ── Left card eyebrow ── */
      .s5-eyebrow {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-weight: 500;
        font-size: 22px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--brand-primary);
        opacity: 0.65;
        margin-bottom: 16px;
        text-align: center;
        align-self: flex-start;
      }

      /* ── Institutional columns SVG ── */
      .s5-columns-svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 78%;
        overflow: visible;
      }

      /* ── Silhouette figure ── */
      .s5-figure-wrap {
        position: absolute;
        bottom: 104px;
        left: 50%;
        transform: translateX(-50%);
        width: 48px;
        height: 140px;
        will-change: transform;
      }
      .s5-figure-svg {
        width: 100%;
        height: 100%;
      }

      /* ── Left card bottom label ── */
      .s5-left-label {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-weight: 500;
        font-size: 22px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--brand-primary);
        opacity: 0.55;
        text-align: center;
        margin-top: 4px;
        align-self: center;
      }

      /* ── Right card header ── */
      .s5-right-eyebrow {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--brand-primary);
        opacity: 0.6;
        margin-bottom: 36px;
      }

      /* ── Label rows — "Bulimia → Glitch" ── */
      .s5-label-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 32px;
        line-height: 1.1;
      }
      .s5-label-row:last-child {
        margin-bottom: 0;
      }

      .s5-orig {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 26px;
        font-weight: 500;
        color: var(--brand-primary);
        opacity: 0.55;
        letter-spacing: 0.04em;
        display: inline-block;
        will-change: transform, text-shadow;
      }

      .s5-arrow {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 22px;
        color: var(--brand-primary);
        opacity: 0.4;
        flex-shrink: 0;
      }

      /* keyword words that glow */
      .s5-kw {
        display: inline-block;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: 34px;
        font-weight: 700;
        color: var(--brand-primary);
        letter-spacing: -0.02em;
        transform-origin: 50% 50%;
        will-change: transform, text-shadow;
        text-shadow: 0 0 0 rgba(31, 58, 138, 0);
      }

      /* ── Paper grain overlay ── */
      .s5-paper-grain-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        opacity: 0.35;
        mix-blend-mode: multiply;
        background-image: var(--paper-grain);
      }
    </style>

    <!-- Camera / zoom wrapper -->
    <div class="s5-camera" id="s5-camera">

      <!-- Split stage -->
      <div class="s5-stage" id="s5-stage">

        <!-- LEFT CARD: institutional columns + dwarfed figure -->
        <div class="s5-card-left" id="s5-card-left" data-layout-role="primary">
          <!-- Towering institutional columns hairline SVG -->
          <svg class="s5-columns-svg" viewBox="0 0 1120 660" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- Column shafts — 7 imposing columns, hairline ink strokes -->
            <g stroke="var(--brand-primary)" stroke-width="1.5" fill="none">
              <!-- Column 1 -->
              <rect x="60" y="0" width="52" height="620" fill="color-mix(in srgb, var(--brand-primary) 5%, transparent)" stroke-width="1.5"/>
              <!-- Column 2 -->
              <rect x="170" y="0" width="52" height="620" fill="color-mix(in srgb, var(--brand-primary) 5%, transparent)" stroke-width="1.5"/>
              <!-- Column 3 -->
              <rect x="280" y="0" width="52" height="620" fill="color-mix(in srgb, var(--brand-primary) 5%, transparent)" stroke-width="1.5"/>
              <!-- Column 4 — center -->
              <rect x="534" y="0" width="52" height="620" fill="color-mix(in srgb, var(--brand-primary) 5%, transparent)" stroke-width="1.5"/>
              <!-- Column 5 -->
              <rect x="788" y="0" width="52" height="620" fill="color-mix(in srgb, var(--brand-primary) 5%, transparent)" stroke-width="1.5"/>
              <!-- Column 6 -->
              <rect x="898" y="0" width="52" height="620" fill="color-mix(in srgb, var(--brand-primary) 5%, transparent)" stroke-width="1.5"/>
              <!-- Column 7 -->
              <rect x="1008" y="0" width="52" height="620" fill="color-mix(in srgb, var(--brand-primary) 5%, transparent)" stroke-width="1.5"/>

              <!-- Architrave / entablature band at top -->
              <rect x="40" y="0" width="1040" height="36" fill="color-mix(in srgb, var(--brand-primary) 10%, transparent)" stroke-width="1.5"/>
              <!-- Frieze band -->
              <rect x="40" y="36" width="1040" height="22" fill="color-mix(in srgb, var(--brand-primary) 6%, transparent)" stroke-width="1.5"/>

              <!-- Stylobate / base steps -->
              <rect x="30" y="620" width="1060" height="18" fill="color-mix(in srgb, var(--brand-primary) 8%, transparent)" stroke-width="1.5"/>
              <rect x="20" y="638" width="1080" height="14" fill="color-mix(in srgb, var(--brand-primary) 6%, transparent)" stroke-width="1.5"/>

              <!-- Column capitals (simple abacus) -->
              <rect x="48" y="56" width="76" height="12" fill="color-mix(in srgb, var(--brand-primary) 10%, transparent)" stroke-width="1.5"/>
              <rect x="158" y="56" width="76" height="12" fill="color-mix(in srgb, var(--brand-primary) 10%, transparent)" stroke-width="1.5"/>
              <rect x="268" y="56" width="76" height="12" fill="color-mix(in srgb, var(--brand-primary) 10%, transparent)" stroke-width="1.5"/>
              <rect x="522" y="56" width="76" height="12" fill="color-mix(in srgb, var(--brand-primary) 10%, transparent)" stroke-width="1.5"/>
              <rect x="776" y="56" width="76" height="12" fill="color-mix(in srgb, var(--brand-primary) 10%, transparent)" stroke-width="1.5"/>
              <rect x="886" y="56" width="76" height="12" fill="color-mix(in srgb, var(--brand-primary) 10%, transparent)" stroke-width="1.5"/>
              <rect x="996" y="56" width="76" height="12" fill="color-mix(in srgb, var(--brand-primary) 10%, transparent)" stroke-width="1.5"/>

              <!-- Column bases -->
              <rect x="48" y="608" width="76" height="12" fill="color-mix(in srgb, var(--brand-primary) 10%, transparent)" stroke-width="1.5"/>
              <rect x="158" y="608" width="76" height="12" fill="color-mix(in srgb, var(--brand-primary) 10%, transparent)" stroke-width="1.5"/>
              <rect x="268" y="608" width="76" height="12" fill="color-mix(in srgb, var(--brand-primary) 10%, transparent)" stroke-width="1.5"/>
              <rect x="522" y="608" width="76" height="12" fill="color-mix(in srgb, var(--brand-primary) 10%, transparent)" stroke-width="1.5"/>
              <rect x="776" y="608" width="76" height="12" fill="color-mix(in srgb, var(--brand-primary) 10%, transparent)" stroke-width="1.5"/>
              <rect x="886" y="608" width="76" height="12" fill="color-mix(in srgb, var(--brand-primary) 10%, transparent)" stroke-width="1.5"/>
              <rect x="996" y="608" width="76" height="12" fill="color-mix(in srgb, var(--brand-primary) 10%, transparent)" stroke-width="1.5"/>
            </g>
          </svg>

          <!-- Dwarfed figure — ink silhouette -->
          <div class="s5-figure-wrap" id="s5-figure">
            <svg class="s5-figure-svg" viewBox="0 0 48 140" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-label="lone figure">
              <!-- Head -->
              <circle cx="24" cy="13" r="10" fill="var(--brand-primary)"/>
              <!-- Torso -->
              <rect x="16" y="24" width="16" height="52" rx="3" fill="var(--brand-primary)"/>
              <!-- Left arm -->
              <rect x="4" y="26" width="11" height="7" rx="3" fill="var(--brand-primary)" transform="rotate(15 9 30)"/>
              <!-- Right arm -->
              <rect x="33" y="26" width="11" height="7" rx="3" fill="var(--brand-primary)" transform="rotate(-15 39 30)"/>
              <!-- Left leg -->
              <rect x="14" y="74" width="10" height="52" rx="3" fill="var(--brand-primary)" transform="rotate(5 19 100)"/>
              <!-- Right leg -->
              <rect x="24" y="74" width="10" height="52" rx="3" fill="var(--brand-primary)" transform="rotate(-5 29 100)"/>
            </svg>
          </div>

          <!-- Bottom label -->
          <span class="s5-eyebrow">INSTITUTIONAL WEIGHT</span>
        </div>

        <!-- RIGHT CARD: corporate relabeling list with keyword glow -->
        <div class="s5-card-right" id="s5-card-right" data-layout-role="supporting">
          <div class="s5-right-eyebrow">CORPORATE REVIEW</div>

          <!-- Row 1 -->
          <div class="s5-label-row">
            <span class="s5-orig">Bulimia</span>
            <span class="s5-arrow">→</span>
            <span class="s5-kw" data-word="glitch">Glitch</span>
          </div>

          <!-- Row 2 -->
          <div class="s5-label-row">
            <span class="s5-orig">Self-harm</span>
            <span class="s5-arrow">→</span>
            <span class="s5-kw" data-word="embarrassment">Embarrassment</span>
          </div>

          <!-- Row 3 -->
          <div class="s5-label-row">
            <span class="s5-orig">Depression</span>
            <span class="s5-arrow">→</span>
            <span class="s5-kw" data-word="brand-risk">Brand risk</span>
          </div>
        </div>

      </div><!-- end .s5-stage -->

    </div><!-- end .s5-camera -->

    <!-- Paper grain atmospheric overlay -->
    <div class="s5-paper-grain-overlay" aria-hidden="true"></div>

    <script>
      const EASE = {
        entry: "power2.out",
        emphasis: "power3.out",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 0.95,
      };

      // ── ASR keyword glow constants ──
      const ATTACK_DUR  = 0.18;
      const RELEASE     = 0.35;
      const REST_LEVEL  = 0.12;
      const MAX_BLUR    = 22;         // px — cold corporate eye, not warmth
      const MAX_SCALE_BOOST = 0.10;
      // glow colour: brand-primary rgba (31, 58, 138) — cold blue-ink, not warm
      function glowColorRgba(env) {
        const alpha = 0.12 + env * 0.55;
        return `rgba(31,58,138,${alpha.toFixed(3)})`;
      }

      // Per-word ASR timings (local seconds, non-overlapping)
      const TIMINGS = {
        "glitch":         { start: 1.3,  end: 1.85 },
        "embarrassment":  { start: 2.6,  end: 3.35 },
        "brand-risk":     { start: 3.9,  end: 4.8  },
      };
      const SCENE_DURATION = 6;

      function envelope(time, start, end) {
        const releaseEnd = end + RELEASE;
        if (time < start) return 0;
        if (time < end) {
          const attack = Math.min((time - start) / ATTACK_DUR, 1);
          return attack;
        }
        if (time < releaseEnd) {
          const decay = (time - end) / RELEASE;
          return 1 - decay * (1 - REST_LEVEL);
        }
        return REST_LEVEL;
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ── Initial hidden states ──
      gsap.set("#s5-card-left",  { opacity: 0, x: -280, rotateY: 18 });
      gsap.set("#s5-card-right", { opacity: 0, x:  180, rotateY: -18 });
      gsap.set(".s5-right-eyebrow", { opacity: 0 });
      gsap.set(".s5-label-row",     { opacity: 0, x: 18 });
      gsap.set(".s5-eyebrow",       { opacity: 0 });

      // ── Phase 1: cards slide in — split-tilt-cards entry ──
      // Left card enters from left at rotateY +12 (faces right)
      tl.fromTo(
        "#s5-card-left",
        { opacity: 0, x: -280, rotateY: 24 },
        { opacity: 1, x: 0,   rotateY: 12, duration: DUR.slow, ease: EASE.emphasis },
        0,
      );
      // Right card enters from right at rotateY -12 (faces left), slight stagger
      tl.fromTo(
        "#s5-card-right",
        { opacity: 0, x: 180, rotateY: -24 },
        { opacity: 1, x: 0,  rotateY: -12, duration: DUR.slow, ease: EASE.emphasis },
        0.12,
      );

      // ── Phase 2: copy reveal ──
      tl.fromTo(
        ".s5-eyebrow",
        { opacity: 0, y: 10 },
        { opacity: 0.65, y: 0, duration: DUR.med, ease: EASE.entry },
        0.6,
      );
      tl.fromTo(
        ".s5-right-eyebrow",
        { opacity: 0, y: 8 },
        { opacity: 0.6, y: 0, duration: DUR.med, ease: EASE.entry },
        0.65,
      );
      // Label rows stagger in
      tl.fromTo(
        ".s5-label-row",
        { opacity: 0, x: 18 },
        { opacity: 1, x: 0, duration: DUR.med, ease: EASE.entry, stagger: 0.12 },
        0.75,
      );

      // ── Phase 3: sine-wave-loop — the dwarfed figure drifts ±2px, alone not breathing ──
      // Per the brief: "sine-wave-loop keeps the small figure drifting ±2px — alone, not breathing"
      // Drive a phase tween from IDLE_START through end of scene
      const IDLE_START = 0.85;
      const IDLE_DUR   = SCENE_DURATION - IDLE_START;   // 5.15s
      const CYCLES     = 2;                              // ~2.5s per breath — breathing cadence
      const Y_AMP_PX   = 2;                             // ±2px exactly per the brief

      const figurePhase = { p: 0 };
      tl.to(
        figurePhase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: () => {
            const yOff = Math.sin(figurePhase.p) * Y_AMP_PX;
            const figEl = document.getElementById("s5-figure");
            if (figEl) figEl.style.transform = `translateX(-50%) translateY(${yOff}px)`;
          },
        },
        IDLE_START,
      );

      // ── Phase 4: asr-keyword-glow — cold corporate eye on the right card ──
      const kwEls = document.querySelectorAll(".s5-kw");
      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: SCENE_DURATION,
          duration: SCENE_DURATION,
          ease: "none",
          onUpdate: () => {
            kwEls.forEach((el) => {
              const word = el.dataset.word;
              const timing = TIMINGS[word];
              if (!timing) return;
              const env = envelope(driver.t, timing.start, timing.end);
              const blur  = MAX_BLUR * env;
              const scl   = 1 + MAX_SCALE_BOOST * env;
              el.style.textShadow = `0 0 ${blur}px ${glowColorRgba(env)}`;
              el.style.transform  = `scale(${scl})`;
            });
          },
        },
        0,
      );

      // ── Phase 5: macro camera — slow zoom-in (ONE root-level macro move) ──
      tl.fromTo(
        "#s5-camera",
        { scale: 1.0 },
        { scale: 1.06, duration: SCENE_DURATION, ease: "none" },
        0,
      );

      window.__timelines["scene_5"] = tl;
    </script>
  </div>
</template>
