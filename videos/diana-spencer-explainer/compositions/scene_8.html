    <!-- Paper grain overlay — top of z-stack, below interactive -->

    <script>
      const EASE = {
        entry: "power2.out",
        emphasis: "power3.out",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 0.95,
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ─────────────────────────────────────────────
      // 3D TEXT DEPTH LAYERS — build "OUT" depth stack
      // ─────────────────────────────────────────────
      const LAYER_COUNT = 5;
      const OFFSET_X = 2;
      const OFFSET_Y = 2;
      const BACK_ALPHA_MAX = 0.75;
      const BACK_ALPHA_STEP = 0.12;
      const BACK_ALPHA_MIN = 0.15;
      // Back layer color — brand-primary RGB: 31, 58, 138
      const BACK_RGB = "31, 58, 138";

      const depthWrap = document.querySelector("#s8-depth-wrap");

      // Build layers back-to-front so front (i=0) is last appended (position:relative defines container size)
      for (let i = LAYER_COUNT - 1; i >= 0; i--) {
        const el = document.createElement("div");
        el.className = "s8-depth-text " + (i === 0 ? "s8-is-front" : "s8-is-back");
        el.textContent = "OUT";
        el.dataset.layer = String(i);
        if (i > 0) {
          const alpha = Math.max(BACK_ALPHA_MAX - i * BACK_ALPHA_STEP, BACK_ALPHA_MIN);
          el.style.color = "rgba(" + BACK_RGB + ", " + alpha + ")";
          el.style.transform = "translate(" + (i * OFFSET_X) + "px, " + (i * OFFSET_Y) + "px)";
        } else {
          el.style.color = "var(--brand-primary)";
        }
        depthWrap.appendChild(el);
      }

      // ─────────────────────────────────────────────
      // CARD MORPH ANCHOR
      // Constants
      const HOLD_BEAT = 0.5;
      const MORPH_START = 0.5;
      const MORPH_DUR = 0.95;
      const SHOT_TWO_W = 720;
      const SHOT_TWO_H = 490;
      const SHOT_TWO_RADIUS = 4;
      const OLD_FADE_FRAC = 0.4;
      const NEW_FADE_FRAC = 0.4;

      // Set initial states
      gsap.set("#s8-morph-new", { opacity: 0 });
      gsap.set("#s8-strips-container", { opacity: 0 });
      gsap.set("#s8-headline-zone", { opacity: 0 });
      gsap.set("#s8-asr-zone", { opacity: 0 });
      gsap.set("#s8-stamp", { opacity: 0 });
      gsap.set("#s8-hairline-1", { opacity: 0 });
      gsap.set("#s8-hairline-2", { opacity: 0 });

      // Phase 1 — morph strip → tall card
      tl.to(
        "#s8-morph-card",
        {
          width: SHOT_TWO_W,
          height: SHOT_TWO_H,
          borderRadius: SHOT_TWO_RADIUS,
          duration: MORPH_DUR,
          ease: "power2.inOut",
        },
        MORPH_START,
      );

      // Phase 2 — old content (label) fades out early
      tl.to(
        "#s8-morph-old",
        {
          opacity: 0,
          duration: MORPH_DUR * OLD_FADE_FRAC,
          ease: "power1.in",
        },
        MORPH_START,
      );

      // Phase 3 — new content (dress silhouette) fades in late
      tl.to(
        "#s8-morph-new",
        {
          opacity: 1,
          duration: MORPH_DUR * NEW_FADE_FRAC,
          ease: "power1.out",
        },
        MORPH_START + MORPH_DUR * (1 - NEW_FADE_FRAC),
      );

      // Tabloid strips appear once card is expanded
      tl.to(
        "#s8-strips-container",
        {
          opacity: 1,
          duration: DUR.med,
          ease: EASE.entry,
        },
        MORPH_START + MORPH_DUR + 0.1,
      );

      // ─────────────────────────────────────────────
      // HEADLINE ZONE entry (right side)
      // ─────────────────────────────────────────────
      const HEADLINE_IN = MORPH_START + MORPH_DUR * 0.5; // start while morph is progressing

      tl.fromTo(
        "#s8-headline-zone",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: DUR.slow, ease: EASE.entry },
        HEADLINE_IN,
      );

      // Hairlines sweep in
      tl.fromTo(
        "#s8-hairline-1",
        { opacity: 0, scaleX: 0 },
        { opacity: 0.45, scaleX: 1, duration: DUR.med, ease: EASE.entry, transformOrigin: "left center" },
        HEADLINE_IN,
      );
      tl.fromTo(
        "#s8-hairline-2",
        { opacity: 0, scaleX: 0 },
        { opacity: 0.45, scaleX: 1, duration: DUR.med, ease: EASE.entry, transformOrigin: "left center" },
        HEADLINE_IN + 0.15,
      );

      // ─────────────────────────────────────────────
      // 3D TEXT DEPTH LAYERS — cascade entry for "OUT"
      // ─────────────────────────────────────────────
      const LAYER_CASCADE_START = HEADLINE_IN + 0.1;
      const LAYER_CASCADE_STEP = 0.06;
      const LAYER_FADE_DUR = 0.45;
      const DEPTH_GROW_START = LAYER_CASCADE_START;
      const DEPTH_GROW_DUR = 0.55;

      const allLayers = depthWrap.querySelectorAll(".s8-depth-text");
      allLayers.forEach((el) => {
        const i = Number(el.dataset.layer);
        const finalAlpha = el.classList.contains("s8-is-front")
          ? 1
          : Math.max(BACK_ALPHA_MAX - i * BACK_ALPHA_STEP, BACK_ALPHA_MIN);
        tl.fromTo(
          el,
          { opacity: 0 },
          {
            opacity: finalAlpha,
            duration: LAYER_FADE_DUR,
            ease: EASE.entry,
          },
          LAYER_CASCADE_START + (LAYER_COUNT - 1 - i) * LAYER_CASCADE_STEP,
        );
      });

      // Depth grow — offset interpolates 0 → full
      const depthState = { p: 0 };
      tl.to(
        depthState,
        {
          p: 1,
          duration: DEPTH_GROW_DUR,
          ease: EASE.entry,
          onUpdate: () => {
            depthWrap.querySelectorAll(".s8-depth-text.s8-is-back").forEach((el) => {
              const i = Number(el.dataset.layer);
              const x = i * OFFSET_X * depthState.p;
              const y = i * OFFSET_Y * depthState.p;
              el.style.transform = "translate(" + x + "px, " + y + "px)";
            });
          },
        },
        DEPTH_GROW_START,
      );

      // ─────────────────────────────────────────────
      // STAMP — "CONFESSES" slams in
      // ─────────────────────────────────────────────
      const STAMP_IN = HEADLINE_IN + 0.8;
      tl.fromTo(
        "#s8-stamp",
        { opacity: 0, scale: 1.08 },
        { opacity: 1, scale: 1, duration: DUR.snap, ease: EASE.emphasis },
        STAMP_IN,
      );

      // ─────────────────────────────────────────────
      // ASR KEYWORD PHRASE entry
      // ─────────────────────────────────────────────
      const ASR_IN = 2.8;
      tl.fromTo(
        "#s8-asr-zone",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry },
        ASR_IN,
      );

      // ─────────────────────────────────────────────
      // ASR KEYWORD GLOW — "REVENGE DRESS" pulses (keyword glow)
      // Words: she, was, REVENGE DRESS, front, pages
      // Brief says: pulses "erased" and "front pages" — mapped to "REVENGE DRESS" and "front pages" in the DOM
      // ─────────────────────────────────────────────
      const ATTACK_DUR = 0.18;
      const RELEASE = 0.35;
      const REST_LEVEL = 0.12;
      const MAX_BLUR = 28;
      const MAX_SCALE_BOOST = 0.12;
      const SCENE_DURATION = 7;

      // Keyword timings (local to scene)
      // After ASR zone appears at 2.8s: "she" 3.0-3.3, "was" 3.3-3.6, "REVENGE DRESS" 3.7-5.0 (long sustain), "front" 5.2-5.5, "pages" 5.5-6.1
      const TIMINGS = {
        "she":          { start: 3.0, end: 3.3 },
        "was":          { start: 3.3, end: 3.6 },
        "revenge-dress":{ start: 3.7, end: 5.0 },
        "front":        { start: 5.2, end: 5.5 },
        "pages":        { start: 5.5, end: 6.1 },
      };

      // Color channels
      // Rest: brand primary dim — rgb(31,58,138) at lower opacity via lerp → near-grey
      const REST_RGB  = { r: 80,  g: 100, b: 160 };
      // Active (non-keyword): brand-primary bright
      const ACTIVE_RGB = { r: 31,  g: 58,  b: 138 };
      // Brand keyword: brand-accent crimson rgb(194,52,43)
      const BRAND_RGB  = { r: 194, g: 52,  b: 43 };

      function lerpChannel(a, b, t) {
        return Math.round(a + (b - a) * t);
      }
      function colorAt(env, isBrand) {
        const target = isBrand ? BRAND_RGB : ACTIVE_RGB;
        return "rgb(" + lerpChannel(REST_RGB.r, target.r, env) + "," + lerpChannel(REST_RGB.g, target.g, env) + "," + lerpChannel(REST_RGB.b, target.b, env) + ")";
      }
      function glowColorRgba(env, isBrand) {
        const r = isBrand ? 194 : 31;
        const g = isBrand ? 52  : 58;
        const b = isBrand ? 43  : 138;
        const alpha = 0.1 + env * 0.7;
        return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
      }

      function envelope(time, start, end) {
        const releaseEnd = end + RELEASE;
        if (time < start) return 0;
        if (time < end) {
          const attack = Math.min((time - start) / ATTACK_DUR, 1);
          return attack;
        }
        if (time < releaseEnd) {
          const decay = (time - end) / RELEASE;
          return 1 - decay * (1 - REST_LEVEL);
        }
        return REST_LEVEL;
      }

      const wordEls = document.querySelectorAll(".s8-word");

      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: SCENE_DURATION,
          duration: SCENE_DURATION,
          ease: "none",
          onUpdate: () => {
            wordEls.forEach((el) => {
              const word = el.dataset.word;
              const timing = TIMINGS[word];
              if (!timing) return;
              const env = envelope(driver.t, timing.start, timing.end);
              const isBrand = el.classList.contains("s8-keyword");
              const blur = MAX_BLUR * env;
              const scale = 1 + MAX_SCALE_BOOST * env;
              el.style.textShadow = "0 0 " + blur + "px " + glowColorRgba(env, isBrand);
              el.style.transform = "scale(" + scale + ")";
              el.style.color = colorAt(env, isBrand);
            });
          },
        },
        0,
