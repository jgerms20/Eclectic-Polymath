<template id="scene_9-template">
  <div id="root" class="scene_9-root" data-composition-id="scene_9" data-width="1920" data-height="1080" data-duration="6" style="position:relative; width:1920px; height:1080px; overflow:hidden;">
    <style>
      @font-face { font-family: 'Space Grotesk'; src: url('../public/space-grotesk-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: 'Space Grotesk'; src: url('../public/space-grotesk-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
      @font-face { font-family: 'Caveat'; src: url('../public/caveat-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: 'Caveat'; src: url('../public/caveat-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
      :root {
        --font-body: 'Space Grotesk', system-ui, sans-serif;
        --font-display: 'Space Grotesk', system-ui, sans-serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
        --font-script: 'Caveat', cursive;
      }
      #root {
        background: var(--canvas);
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
      #root *,
      #root *::before,
      #root *::after {
        box-sizing: border-box;
      }

      /* Layout: asymmetric 60/40 */
      .s9-layout {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        z-index: 2;
      }

      /* Left 60% — spy-file folder schematic */
      .s9-left {
        width: 60%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 80px 60px 80px 80px;
      }

      /* Right 40% — route diagram + text sequence */
      .s9-right {
        width: 40%;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 80px 80px 80px 40px;
        gap: 32px;
      }

      /* Left panel: SVG folder schematic */
      .s9-folder-svg {
        width: 660px;
        height: 580px;
        overflow: visible;
      }

      /* All SVG paths start invisible (set via JS getTotalLength) */
      .s9-folder-svg path,
      .s9-folder-svg line,
      .s9-folder-svg circle,
      .s9-folder-svg ellipse,
      .s9-folder-svg rect {
        fill: none;
        stroke: var(--brand-primary);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Reel circles for the cassette — keep stroke so we can draw them */
      .s9-reel-left,
      .s9-reel-right {
        fill: none;
        stroke: var(--brand-primary);
        stroke-width: 2.5;
        transform-origin: center center;
        will-change: transform;
      }

      /* Tape path connecting reels */
      .s9-tape-path {
        fill: none;
        stroke: var(--brand-primary);
        stroke-width: 2.5;
        stroke-linecap: round;
      }

      /* Handwritten tape labels */
      .s9-tape-labels {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        pointer-events: none;
      }

      .s9-tape-label {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.12em;
        color: var(--brand-primary);
        text-transform: uppercase;
        opacity: 0;
      }

      /* Right panel: route diagram SVG */
      .s9-route-svg {
        width: 340px;
        height: 360px;
        overflow: visible;
      }

      .s9-route-svg path,
      .s9-route-svg line,
      .s9-route-svg circle {
        fill: none;
        stroke: var(--brand-primary);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 6 5;
      }

      .s9-route-svg .s9-solid-path {
        stroke-dasharray: none;
      }

      /* Route icon groups */
      .s9-palace-icon,
      .s9-bike-icon,
      .s9-book-icon {
        fill: none;
        stroke: var(--brand-primary);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Discrete text sequence strip */
      .s9-text-seq-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .s9-seq-label {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.14em;
        color: var(--brand-primary);
        opacity: 0.55;
        text-transform: uppercase;
      }

      .s9-seq-text {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 32px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--brand-primary);
        white-space: nowrap;
        min-width: 340px;
        text-align: center;
      }

      /* Stamp — top-right corner */
      .s9-stamp-wrap {
        position: absolute;
        top: 64px;
        right: 80px;
        z-index: 10;
      }

      .s9-stamp {
        display: inline-block;
        border: var(--border-stamp);
        color: var(--brand-accent);
        background: transparent;
        padding: 6px 16px 4px 16px;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-weight: 500;
        font-size: 22px;
        line-height: 1.3;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        border-radius: 0;
        text-align: center;
      }

      /* Paper grain overlay */
      .s9-paper-grain-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        opacity: 0.35;
        mix-blend-mode: multiply;
        background-image: var(--paper-grain);
      }

      /* Slow dolly-in root wrapper */
      .s9-dolly {
        position: absolute;
        inset: 0;
        transform-origin: center center;
        will-change: transform;
        z-index: 2;
      }
    </style>

    <!-- Paper grain atmosphere — below content -->
    <div class="s9-paper-grain-overlay" aria-hidden="true"></div>

    <!-- Stamp top-right (outside dolly so it stays crisp) -->
    <div class="s9-stamp-wrap" id="s9-stamp-wrap">
      <span class="s9-stamp" id="s9-stamp">CLASSIFIED<br>RECEIVED</span>
    </div>

    <!-- Dolly wrapper for slow macro camera push-in -->
    <div class="s9-dolly" id="s9-dolly">
      <div class="s9-layout">

        <!-- LEFT 60%: Spy-file folder schematic -->
        <div class="s9-left" data-layout-role="primary" data-layout-act="folder-reveal">
          <!-- SVG: folder + cassette schematic, all paths drawn live -->
          <svg class="s9-folder-svg" viewBox="0 0 660 580" xmlns="http://www.w3.org/2000/svg">

            <!-- FOLDER COVER — outer border rectangle -->
            <path id="s9-folder-border" d="M 60 120 L 60 520 L 600 520 L 600 120 Z" />
            <!-- FOLDER TAB — top-left tab -->
            <path id="s9-folder-tab" d="M 60 120 L 60 80 L 220 80 L 220 120" />

            <!-- FOLDER CREASE LINE (cover "opening") -->
            <line id="s9-folder-crease" x1="60" y1="240" x2="600" y2="240" />

            <!-- CASSETTE BODY OUTLINE -->
            <path id="s9-cassette-body" d="M 140 280 L 140 480 L 520 480 L 520 280 Z" />
            <!-- Cassette top ridge -->
            <path id="s9-cassette-top" d="M 180 280 L 180 300 L 480 300 L 480 280" />
            <!-- Cassette window cutout (the "eye") -->
            <path id="s9-cassette-window" d="M 200 320 Q 200 360 240 360 L 420 360 Q 460 360 460 320 L 460 310 L 200 310 Z" />

            <!-- REEL LEFT — circle (will be drawn then rotated by sine-wave-loop) -->
            <circle id="s9-reel-left" class="s9-reel-left" cx="260" cy="380" r="46" />
            <!-- Reel left hub -->
            <circle id="s9-reel-left-hub" cx="260" cy="380" r="12" />
            <!-- Reel left spokes -->
            <line id="s9-spoke-l1" x1="260" y1="334" x2="260" y2="368" />
            <line id="s9-spoke-l2" x1="300" y1="380" x2="272" y2="380" />
            <line id="s9-spoke-l3" x1="260" y1="426" x2="260" y2="392" />

            <!-- REEL RIGHT — circle -->
            <circle id="s9-reel-right" class="s9-reel-right" cx="400" cy="380" r="46" />
            <!-- Reel right hub -->
            <circle id="s9-reel-right-hub" cx="400" cy="380" r="12" />
            <!-- Reel right spokes -->
            <line id="s9-spoke-r1" x1="400" y1="334" x2="400" y2="368" />
            <line id="s9-spoke-r2" x1="444" y1="380" x2="412" y2="380" />
            <line id="s9-spoke-r3" x1="400" y1="426" x2="400" y2="392" />

            <!-- TAPE PATH from left reel to right reel (bottom arc) -->
            <path id="s9-tape-bottom" class="s9-tape-path" d="M 225 408 Q 330 445 375 408" />

          </svg>

          <!-- Tape labels (appear via discrete-text-sequence logic, text slots) -->
          <div style="position:absolute; left:50%; top:58%; transform:translate(-50%, -50%); display:flex; flex-direction:column; gap:10px; pointer-events:none; z-index:5;">
            <span class="s9-tape-label" id="s9-tape-label-1">Session 1</span>
            <span class="s9-tape-label" id="s9-tape-label-2">Session 2</span>
            <span class="s9-tape-label" id="s9-tape-label-3">SMUGGLED</span>
          </div>
        </div>

        <!-- RIGHT 40%: Route diagram + discrete text sequence -->
        <div class="s9-right" data-layout-role="supporting" data-layout-act="route-diagram">

          <!-- Route diagram SVG: palace → bicycle → book -->
          <svg class="s9-route-svg" id="s9-route-svg" viewBox="0 0 340 360" xmlns="http://www.w3.org/2000/svg">

            <!-- PALACE SILHOUETTE (top) — simplified outline, hairlines -->
            <g id="s9-palace-group">
              <!-- Palace base -->
              <rect id="s9-palace-base" x="110" y="100" width="120" height="60" class="s9-solid-path" style="stroke-dasharray:none;" />
              <!-- Palace columns -->
              <line id="s9-palace-col1" x1="125" y1="100" x2="125" y2="160" class="s9-solid-path" style="stroke-dasharray:none;" />
              <line id="s9-palace-col2" x1="155" y1="100" x2="155" y2="160" class="s9-solid-path" style="stroke-dasharray:none;" />
              <line id="s9-palace-col3" x1="185" y1="100" x2="185" y2="160" class="s9-solid-path" style="stroke-dasharray:none;" />
              <line id="s9-palace-col4" x1="215" y1="100" x2="215" y2="160" class="s9-solid-path" style="stroke-dasharray:none;" />
              <!-- Palace roof pediment -->
              <path id="s9-palace-roof" d="M 100 100 L 170 60 L 240 100" class="s9-solid-path" style="stroke-dasharray:none;" />
              <!-- Palace flag -->
              <line id="s9-palace-flag" x1="170" y1="60" x2="170" y2="30" class="s9-solid-path" style="stroke-dasharray:none;" />
              <path id="s9-palace-flag-shape" d="M 170 30 L 195 38 L 170 46" class="s9-solid-path" style="stroke-dasharray:none; fill:var(--brand-primary);" />
            </g>

            <!-- DASHED ROUTE LINE: palace to bicycle -->
            <path id="s9-route-line-1" d="M 170 170 L 170 230" />
            <!-- Arrow indicator -->
            <path id="s9-arrow-1" d="M 163 220 L 170 235 L 177 220" class="s9-solid-path" style="stroke-dasharray:none;" />

            <!-- BICYCLE ICON (middle) — two wheels + frame -->
            <g id="s9-bike-group">
              <circle id="s9-bike-wheel-l" cx="130" cy="270" r="24" class="s9-solid-path" style="stroke-dasharray:none;" />
              <circle id="s9-bike-wheel-r" cx="210" cy="270" r="24" class="s9-solid-path" style="stroke-dasharray:none;" />
              <!-- Frame -->
              <path id="s9-bike-frame" d="M 130 270 L 160 248 L 210 270 M 160 248 L 180 248 M 180 248 L 180 262 M 160 248 L 170 225 L 195 225 L 180 248" class="s9-solid-path" style="stroke-dasharray:none;" />
              <!-- Handlebars -->
              <path id="s9-bike-bars" d="M 195 225 L 200 215 L 215 215" class="s9-solid-path" style="stroke-dasharray:none;" />
            </g>

            <!-- DASHED ROUTE LINE: bicycle to book -->
            <path id="s9-route-line-2" d="M 170 300 L 170 340" />

          </svg>

          <!-- Discrete text sequence: PALACE → BASKET → AUTHOR -->
          <div class="s9-text-seq-wrap" id="s9-text-seq-wrap">
            <span class="s9-seq-label">ROUTE</span>
            <span class="s9-seq-text" id="s9-seq-text">PALACE</span>
          </div>

        </div>
      </div>
    </div>

    <script>
      const EASE = {
        entry: "power2.out",
        emphasis: "power3.out",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 0.95,
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ── Initial hidden states ──────────────────────────────────────────────
      gsap.set("#s9-stamp-wrap", { opacity: 0, scale: 1.08 });
      gsap.set("#s9-tape-label-1", { opacity: 0 });
      gsap.set("#s9-tape-label-2", { opacity: 0 });
      gsap.set("#s9-tape-label-3", { opacity: 0 });
      gsap.set("#s9-text-seq-wrap", { opacity: 0 });

      // ── svg-path-draw: measure all paths and set dasharray/dashoffset ──────
      const drawPaths = [
        "#s9-folder-border",
        "#s9-folder-tab",
        "#s9-folder-crease",
        "#s9-cassette-body",
        "#s9-cassette-top",
        "#s9-cassette-window",
        "#s9-reel-left",
        "#s9-reel-left-hub",
        "#s9-spoke-l1",
        "#s9-spoke-l2",
        "#s9-spoke-l3",
        "#s9-reel-right",
        "#s9-reel-right-hub",
        "#s9-spoke-r1",
        "#s9-spoke-r2",
        "#s9-spoke-r3",
        "#s9-tape-bottom",
        "#s9-palace-base",
        "#s9-palace-col1",
        "#s9-palace-col2",
        "#s9-palace-col3",
        "#s9-palace-col4",
        "#s9-palace-roof",
        "#s9-palace-flag",
        "#s9-palace-flag-shape",
        "#s9-route-line-1",
        "#s9-arrow-1",
        "#s9-bike-wheel-l",
        "#s9-bike-wheel-r",
        "#s9-bike-frame",
        "#s9-bike-bars",
        "#s9-route-line-2",
      ];

      drawPaths.forEach(function(sel) {
        var el = document.querySelector(sel);
        if (!el) return;
        var len = el.getTotalLength ? el.getTotalLength() : 100;
        el.style.strokeDasharray = "" + len;
        el.style.strokeDashoffset = "" + len;
      });

      // ── Phase 1: Folder cover draws (0 → 1.2s) ───────────────────────────
      // Folder border outline
      tl.to("#s9-folder-border", { strokeDashoffset: 0, duration: 0.7, ease: EASE.entry }, 0.1);
      // Folder tab
      tl.to("#s9-folder-tab", { strokeDashoffset: 0, duration: 0.35, ease: EASE.entry }, 0.5);
      // Folder crease (cover "opening")
      tl.to("#s9-folder-crease", { strokeDashoffset: 0, duration: 0.4, ease: EASE.entry }, 0.75);

      // ── Phase 2: Cassette body reveals (1.1 → 2.2s) ─────────────────────
      tl.to("#s9-cassette-body", { strokeDashoffset: 0, duration: 0.55, ease: EASE.entry }, 1.1);
      tl.to("#s9-cassette-top", { strokeDashoffset: 0, duration: 0.25, ease: EASE.entry }, 1.45);
      tl.to("#s9-cassette-window", { strokeDashoffset: 0, duration: 0.3, ease: EASE.entry }, 1.6);

      // ── Phase 3: Reels drawn (1.8 → 2.6s) ───────────────────────────────
      tl.to("#s9-reel-left", { strokeDashoffset: 0, duration: 0.45, ease: EASE.entry }, 1.8);
      tl.to("#s9-reel-left-hub", { strokeDashoffset: 0, duration: 0.2, ease: EASE.entry }, 2.0);
      tl.to("#s9-spoke-l1", { strokeDashoffset: 0, duration: 0.15, ease: EASE.entry }, 2.1);
      tl.to("#s9-spoke-l2", { strokeDashoffset: 0, duration: 0.15, ease: EASE.entry }, 2.18);
      tl.to("#s9-spoke-l3", { strokeDashoffset: 0, duration: 0.15, ease: EASE.entry }, 2.26);
      tl.to("#s9-reel-right", { strokeDashoffset: 0, duration: 0.45, ease: EASE.entry }, 1.95);
      tl.to("#s9-reel-right-hub", { strokeDashoffset: 0, duration: 0.2, ease: EASE.entry }, 2.15);
      tl.to("#s9-spoke-r1", { strokeDashoffset: 0, duration: 0.15, ease: EASE.entry }, 2.25);
      tl.to("#s9-spoke-r2", { strokeDashoffset: 0, duration: 0.15, ease: EASE.entry }, 2.33);
      tl.to("#s9-spoke-r3", { strokeDashoffset: 0, duration: 0.15, ease: EASE.entry }, 2.41);
      // Tape path connecting reels
      tl.to("#s9-tape-bottom", { strokeDashoffset: 0, duration: 0.3, ease: EASE.entry }, 2.5);

      // ── Phase 4: Tape labels appear (2.6 → 3.2s) ─────────────────────────
      tl.to("#s9-tape-label-1", { opacity: 1, duration: DUR.snap }, 2.65);
      tl.to("#s9-tape-label-2", { opacity: 1, duration: DUR.snap }, 2.95);
      tl.to("#s9-tape-label-3", { opacity: 1, duration: DUR.snap, color: "var(--brand-accent)" }, 3.2);

      // ── Phase 5: Right side — palace silhouette draws (0.3 → 1.5s) ───────
      tl.to("#s9-palace-base", { strokeDashoffset: 0, duration: 0.3, ease: EASE.entry }, 0.3);
      tl.to("#s9-palace-col1", { strokeDashoffset: 0, duration: 0.2, ease: EASE.entry }, 0.5);
      tl.to("#s9-palace-col2", { strokeDashoffset: 0, duration: 0.2, ease: EASE.entry }, 0.6);
      tl.to("#s9-palace-col3", { strokeDashoffset: 0, duration: 0.2, ease: EASE.entry }, 0.7);
      tl.to("#s9-palace-col4", { strokeDashoffset: 0, duration: 0.2, ease: EASE.entry }, 0.8);
      tl.to("#s9-palace-roof", { strokeDashoffset: 0, duration: 0.35, ease: EASE.entry }, 0.85);
      tl.to("#s9-palace-flag", { strokeDashoffset: 0, duration: 0.15, ease: EASE.entry }, 1.1);
      tl.to("#s9-palace-flag-shape", { strokeDashoffset: 0, duration: 0.15, ease: EASE.entry }, 1.2);
      // Route lines and bicycle
      tl.to("#s9-route-line-1", { strokeDashoffset: 0, duration: 0.3, ease: EASE.entry }, 1.5);
      tl.to("#s9-arrow-1", { strokeDashoffset: 0, duration: 0.15, ease: EASE.entry }, 1.75);
      tl.to("#s9-bike-wheel-l", { strokeDashoffset: 0, duration: 0.3, ease: EASE.entry }, 1.85);
      tl.to("#s9-bike-wheel-r", { strokeDashoffset: 0, duration: 0.3, ease: EASE.entry }, 2.0);
      tl.to("#s9-bike-frame", { strokeDashoffset: 0, duration: 0.35, ease: EASE.entry }, 2.1);
      tl.to("#s9-bike-bars", { strokeDashoffset: 0, duration: 0.2, ease: EASE.entry }, 2.35);
      tl.to("#s9-route-line-2", { strokeDashoffset: 0, duration: 0.2, ease: EASE.entry }, 2.55);

      // ── discrete-text-sequence: PALACE → BASKET → AUTHOR ─────────────────
      // Sequence of covert-operation labels cycling in the text strip
      const SEQUENCE = [
        { t: 0.0,  text: "PALACE" },
        { t: 2.8,  text: "PALACE → BASKET" },
        { t: 4.0,  text: "PALACE → BASKET → AUTHOR" },
      ];

      function textAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }

      var seqEl = document.getElementById("s9-seq-text");

      // Show text-seq-wrap at 2.6s
      tl.to("#s9-text-seq-wrap", { opacity: 1, duration: DUR.snap }, 2.6);

      // Driver tween for discrete text
      var driver = { t: 0 };
      tl.to(driver, {
        t: 6,
        duration: 6,
        ease: "none",
        onUpdate: function() {
          if (seqEl) seqEl.textContent = textAt(driver.t);
        },
      }, 0);

      // ── sine-wave-loop: cassette reels rotate ─────────────────────────────
      // Both reels animate rotation after they are drawn (after ~2.5s)
      // Using direct style.transform in onUpdate for reel left (clockwise)
      // and reel right (counter-clockwise)
      var reelPhase = { p: 0 };
      var IDLE_START = 2.6;
      var IDLE_DUR = 6 - IDLE_START; // 3.4s

      tl.to(reelPhase, {
        p: Math.PI * 2 * 2.5, // ~2.5 rotation cycles over idle
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: function() {
          // Reels: gentle continuous rotation (cassette tape rolling)
          var angleDeg = (reelPhase.p / (Math.PI * 2)) * 360;
          var reelL = document.getElementById("s9-reel-left");
          var reelR = document.getElementById("s9-reel-right");
          if (reelL) reelL.style.transform = "rotate(" + angleDeg + "deg)";
          if (reelR) reelR.style.transform = "rotate(" + (-angleDeg) + "deg)";

          // Spokes rotate with their respective reels
          ["s9-spoke-l1","s9-spoke-l2","s9-spoke-l3"].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.style.transform = "rotate(" + angleDeg + "deg)";
          });
          ["s9-spoke-r1","s9-spoke-r2","s9-spoke-r3"].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.style.transform = "rotate(" + (-angleDeg) + "deg)";
          });
        },
      }, IDLE_START);

      // ── Stamp slam (top-right) ────────────────────────────────────────────
      // Stamp appears at 0.4s with a scale-slam from 1.08 → 1, stays at -4°
      tl.to("#s9-stamp-wrap", {
        opacity: 1,
        scale: 1,
        duration: DUR.snap,
        ease: EASE.emphasis,
      }, 0.4);
      // Apply -4° rotation to stamp (CSS baked to component, we keep it)
      gsap.set("#s9-stamp", { rotation: -4 });

      // ── Slow dolly-in (macro camera) ─────────────────────────────────────
      tl.fromTo("#s9-dolly",
        { scale: 1.0 },
        { scale: 1.035, duration: 6, ease: "none" },
        0
      );

      window.__timelines["scene_9"] = tl;
    </script>
  </div>
</template>
