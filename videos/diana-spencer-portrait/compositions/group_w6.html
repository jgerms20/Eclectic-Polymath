    <script>
      const EASE = {
        entry: "power2.out",
        emphasis: "power3.out",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 0.95,
      };

      window.__timelines = window.__timelines || {};

      // Scene segment offsets within the group timeline
      const T = { scene_6: 0, scene_7: 6 };

      // ─── Initial hidden states (gsap.set, not CSS opacity:0) ───
      gsap.set("#s6-scene", { opacity: 1 });
      gsap.set("#s7-scene", { opacity: 0 });

      // Hide incoming swap card initially
      gsap.set("#s6-swap-in", { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" });
      gsap.set("#s6-swap-out", { opacity: 1, scale: 1, transformOrigin: "50% 50%" });

      // Hide scribble initially
      gsap.set("#s6-scribble", { clipPath: "inset(0 100% 0 0)" });

      // Hide scene 7 elements initially
      const figures = document.querySelectorAll(".s7-figure");
      figures.forEach(function(el) {
        gsap.set(el, { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.5, opacity: 0 });
      });
      gsap.set(".s7-spoke-line", { opacity: 0 });
      gsap.set("#s7-label-0", { opacity: 0, y: 12 });
      gsap.set("#s7-label-1", { opacity: 0, y: 12 });
      gsap.set("#s7-label-2", { opacity: 0, y: 12 });
      gsap.set("#s7-body-chip", { opacity: 0, y: 20 });

      // ─── SVG path-draw setup: measure hand paths ───
      var handPaths = ["s6-palm","s6-index","s6-middle","s6-ring","s6-pinky","s6-thumb","s6-wrist"];
      var pathLengths = {};
      handPaths.forEach(function(id) {
        var el = document.getElementById(id);
        if (el) {
          var len = el.getTotalLength();
          el.style.strokeDasharray = String(len);
          el.style.strokeDashoffset = String(len);
          pathLengths[id] = len;
        }
      });

      // ─── Build single paused timeline ───
      var tl = gsap.timeline({ paused: true });

      // ════════════════════════════════════════════
      // SCENE 6 segment (T=0 to T=6)
      // ════════════════════════════════════════════

      // [T=0] Chip fades in (outgoing state)
      tl.fromTo("#s6-swap-out",
        { opacity: 0, y: -16 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry },
        T.scene_6 + 0.0
      );

      // [T=0.3] Begin drawing hand — staggered path-draw across ~3s
      // palm: 0.3 → 1.3
      tl.to("#s6-palm", { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, T.scene_6 + 0.3);
      // thumb starts at 0.8
      tl.to("#s6-thumb", { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, T.scene_6 + 0.8);
      // wrist at 1.0
      tl.to("#s6-wrist", { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" }, T.scene_6 + 1.0);
      // index finger at 1.2
      tl.to("#s6-index", { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" }, T.scene_6 + 1.2);
      // middle finger at 1.55
      tl.to("#s6-middle", { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" }, T.scene_6 + 1.55);
      // ring finger at 1.9
      tl.to("#s6-ring", { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" }, T.scene_6 + 1.9);
      // pinky at 2.3
      tl.to("#s6-pinky", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, T.scene_6 + 2.3);

      // [T=2.9] Scribble writes on (clip-path reveal left→right)
      tl.to("#s6-scribble",
        { clipPath: "inset(0 0% 0 0)", duration: DUR.slow, ease: EASE.entry },
        T.scene_6 + 2.9
      );

      // ── Stillness-before-climax at ~3.5s — 0.5s hold, no sine ──
      // sine-wave-loop: subtle hand breathing starts after hand is complete (at ~3.1s)
      // and is suppressed during 3.1–3.6s stillness window; resumes at 3.6s
      // (we start the sine at 3.6 to respect the stillness beat)

      // [T=3.5] scale-swap-transition: chip zooms into focus
      var SWAP_TRIGGER = T.scene_6 + 3.5;
      var EXIT_DUR = 0.35;
      var ENTER_DUR = 0.55;
      var OVERLAP = 0.12;

      // Outgoing shrinks + fades
      tl.to("#s6-swap-out",
        { scale: 0.72, opacity: 0, duration: EXIT_DUR, ease: "power2.in" },
        SWAP_TRIGGER
      );
      // Incoming pops in (using emphasis ease because "paper settling" register avoids back.out)
      // Brief uses emphasis; back.out is typical for this effect but film register says no bounce
      // Using power3.out with slight overshoot-free pop (scale from 0.72 → 1.0)
      tl.to("#s6-swap-in",
        { scale: 1.0, opacity: 1, duration: ENTER_DUR, ease: EASE.emphasis },
        SWAP_TRIGGER + EXIT_DUR - OVERLAP
      );

      // [T=4.0] sine-wave-loop resumes after stillness window — hand gentle breathing
      var HAND_IDLE_START = T.scene_6 + 3.6;
      var HAND_IDLE_DUR = T.scene_7 - HAND_IDLE_START; // ~2.4s
      var handIdlePhase = { p: 0 };
      var handEl = document.querySelector(".s6-hand-wrap");
      tl.to(handIdlePhase, {
        p: Math.PI * 2 * 0.7,
        duration: HAND_IDLE_DUR,
        ease: "none",
        onUpdate: function() {
          var yOff = Math.sin(handIdlePhase.p) * 2.5;
          var sc = 1 + Math.sin(handIdlePhase.p) * 0.008;
          if (handEl) handEl.style.transform = "translateY(" + yOff + "px) scale(" + sc + ")";
        }
      }, HAND_IDLE_START);

      // ════════════════════════════════════════════
      // SCENE 6 → SCENE 7 BOUNDARY: shared morph
      // The s6-scene fades out as s7-scene fades in
      // ════════════════════════════════════════════
      var BOUNDARY = T.scene_7; // 6.0s

      // Fade out Scene 6
      tl.to("#s6-scene", { opacity: 0, duration: DUR.med, ease: EASE.exit }, BOUNDARY - 0.1);

      // Fade in Scene 7 (slight overlap for morph feel)
      tl.to("#s7-scene", { opacity: 1, duration: DUR.med, ease: EASE.entry }, BOUNDARY - 0.05);

      // ════════════════════════════════════════════
      // SCENE 7 segment (T=6 to T=13)
      // ════════════════════════════════════════════

      // [T=6.0] center-outward-expansion: 8 figures burst from center
      var EXPAND_DUR = 1.4;
      var EXPAND_STAGGER = 0.055;
      var EXPAND_ENTRY_AT = T.scene_7 + 0.15;

      figures.forEach(function(el, i) {
        var targetX = Number(el.dataset.targetX);
        var targetY = Number(el.dataset.targetY);
        tl.fromTo(el,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.5, opacity: 0 },
          { x: targetX, y: targetY, scale: 1.0, opacity: 1, duration: EXPAND_DUR, ease: "power3.out" },
          EXPAND_ENTRY_AT + i * EXPAND_STAGGER
        );
      });

      // [T=6.15] Spokes fade in as figures expand
      var spokeLines = document.querySelectorAll(".s7-spoke-line");
      spokeLines.forEach(function(el, i) {
        tl.fromTo(el,
          { opacity: 0 },
          { opacity: 0.55, duration: 0.6, ease: EASE.entry },
          EXPAND_ENTRY_AT + 0.3 + i * 0.04
        );
      });

      // [T=7.8] svg-icon-enrichment: spoke dash-flow animation
      // Animate strokeDashoffset on all spokes as pulsing flows
      var spokeFlowState = { offset: 0 };
      var SPOKE_FLOW_DUR = T.scene_7 + 7 - 7.8; // fills to end of scene
      if (SPOKE_FLOW_DUR < 0.5) var SPOKE_FLOW_DUR = 0.5;
      tl.to(spokeFlowState, {
        offset: -280,
        duration: 5.0,
        ease: "none",
        onUpdate: function() {
          spokeLines.forEach(function(el) {
            el.style.strokeDashoffset = String(spokeFlowState.offset);
          });
        }
      }, T.scene_7 + 1.8);

      // [T=7.6] Three Caveat labels drift in
      tl.fromTo("#s7-label-0",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: DUR.slow, ease: EASE.entry },
        T.scene_7 + 1.6
      );
      tl.fromTo("#s7-label-1",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: DUR.slow, ease: EASE.entry },
        T.scene_7 + 2.1
      );
      tl.fromTo("#s7-label-2",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: DUR.slow, ease: EASE.entry },
        T.scene_7 + 2.6
      );

      // [T=9.2] Body copy chip slides in
      tl.fromTo("#s7-body-chip",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: DUR.slow, ease: EASE.entry },
        T.scene_7 + 3.2
      );

      // [T=7.6] sine-wave-loop: outer silhouettes breathing (collective)
      // Per-element amplitude kept small; each at slightly different period
      var figBreathPhase = [{ p: 0 }, { p: 0 }, { p: 0 }, { p: 0 }, { p: 0 }, { p: 0 }, { p: 0 }, { p: 0 }];
      var BREATH_CYCLES = [0.9, 1.0, 0.85, 1.05, 0.95, 0.8, 1.1, 0.9];
      var FIG_IDLE_START = T.scene_7 + 1.8;
      var FIG_IDLE_DUR = 13 - FIG_IDLE_START;

      figures.forEach(function(el, i) {
        var targetX = Number(el.dataset.targetX);
        var targetY = Number(el.dataset.targetY);
        var phaseObj = figBreathPhase[i];
        var phaseOffset = (i * Math.PI) / 4;
        tl.to(phaseObj, {
          p: Math.PI * 2 * BREATH_CYCLES[i],
          duration: FIG_IDLE_DUR,
          ease: "none",
          onUpdate: function() {
            var yOff = Math.sin(phaseObj.p + phaseOffset) * 3;
            var sc = 1 + Math.sin(phaseObj.p + phaseOffset) * 0.01;
            el.style.transform = "translate(calc(-50% + " + targetX + "px), calc(-50% + " + targetY + "px)) translateY(" + yOff + "px) scale(" + sc + ")";
          }
        }, FIG_IDLE_START);
      });

      // ─── Register timeline ───
      window.__timelines["group_w6"] = tl;
    </script>
  </div>
</template>
