<template id="scene_2-template">
  <div id="root" class="scene_2-root" data-composition-id="scene_2" data-width="1080" data-height="1920" data-duration="6" style="position:relative; width:1080px; height:1920px; overflow:hidden;">
    <style>
    @font-face { font-family: 'Space Grotesk'; src: url('../public/space-grotesk-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'Space Grotesk'; src: url('../public/space-grotesk-latin-700-normal.woff2') format('woff2'); font-weight: 700; font-style: normal; }
    @font-face { font-family: 'Caveat'; src: url('../public/caveat-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'Caveat'; src: url('../public/caveat-latin-700-normal.woff2') format('woff2'); font-weight: 700; font-style: normal; }

      #root {
        background: var(--canvas);
        font-family: 'Space Grotesk', system-ui, sans-serif;
        background-image: var(--paper-grain);
        background-repeat: repeat;
      }
      #root *, #root *::before, #root *::after {
        box-sizing: border-box;
      }

      /* ── Parallax push wrapper ── */
      .s2-parallax-wrap {
        position: absolute;
        inset: 0;
        width: 1200px; /* wider than canvas for parallax room */
        height: 1920px;
        will-change: transform;
      }

      /* ── Top eyebrow chip ── */
      .s2-eyebrow {
        position: absolute;
        top: 96px;
        left: 64px;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-weight: 500;
        font-size: 22px;
        line-height: 1;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--brand-primary);
        opacity: 0;
      }

      /* ── Family tree SVG area ── */
      .s2-tree-wrap {
        position: absolute;
        top: 160px;
        left: 48px;
        width: 984px;
        height: 1120px;
      }

      .s2-tree-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* All paths start invisible; GSAP sets dasharray/dashoffset */
      .s2-tree-svg path,
      .s2-tree-svg line {
        fill: none;
        stroke: var(--brand-primary);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .s2-tree-svg .s2-divider {
        stroke-width: 1.5;
        stroke: var(--brand-primary);
        opacity: 0.45;
      }

      /* Column header labels */
      .s2-col-head {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-weight: 500;
        font-size: 28px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        fill: var(--brand-primary);
        opacity: 0;
      }

      /* Leaf labels on the tree */
      .s2-leaf-label {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-weight: 500;
        font-size: 22px;
        letter-spacing: 0.1em;
        fill: var(--brand-primary);
        opacity: 0;
      }

      /* ── Year-chip discrete sequence area ── */
      .s2-chips-row {
        position: absolute;
        top: 1310px;
        left: 64px;
        display: flex;
        gap: 40px;
        align-items: flex-start;
      }

      .s2-chip-windsor {
        display: inline-block;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-weight: 500;
        font-size: 26px;
        line-height: 1;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--brand-accent);
        border: var(--border-stamp);
        padding: 6px 16px;
        border-radius: 0;
        opacity: 0;
        /* stamp tilt applied via GSAP rotation, not CSS transform */
      }

      .s2-chip-spencer {
        display: inline-block;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-weight: 500;
        font-size: 26px;
        line-height: 1;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--brand-accent);
        border: var(--border-stamp);
        padding: 6px 16px;
        border-radius: 0;
        opacity: 0;
        /* stamp tilt applied via GSAP rotation */
      }

      /* ── Bottom scribble note — write-on via clip-path ── */
      .s2-scribble-wrap {
        position: absolute;
        top: 1490px;
        left: 64px;
        width: 860px;
        overflow: hidden; /* clip reveal */
      }

      .s2-scribble {
        font-family: 'Caveat', cursive;
        font-weight: 600;
        font-size: 46px;
        line-height: 1.1;
        color: var(--brand-primary);
        transform-origin: left bottom;
        /* rotate applied via GSAP to keep tilt in gsap, not CSS */
        white-space: nowrap;
        opacity: 0;
      }

      .s2-scribble .s2-underline {
        border-bottom: 2px solid var(--brand-primary);
      }

      /* ── Decorative safety-pin deco, background layer ── */
      .s2-deco-pin {
        position: absolute;
        top: 72px;
        right: 60px;
        width: 36px;
        height: 90px;
        opacity: 0;
      }
    </style>

    <!-- Parallax push wrapper: moves rightward during scene -->
    <div class="s2-parallax-wrap" id="s2-parallax-wrap" data-layout-allow-overflow="true">

      <!-- Decorative safety pin (background deco) -->
      <div class="s2-deco-pin" id="s2-deco-pin">
        <svg viewBox="0 0 36 90" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="18" cy="14" rx="10" ry="9" stroke="var(--brand-primary)" stroke-width="2"/>
          <line x1="18" y1="23" x2="18" y2="78" stroke="var(--brand-primary)" stroke-width="2" stroke-linecap="round"/>
          <ellipse cx="18" cy="80" rx="6" ry="5" stroke="var(--brand-primary)" stroke-width="2"/>
          <circle cx="18" cy="14" r="3" fill="var(--brand-primary)"/>
        </svg>
      </div>

      <!-- Top eyebrow chip -->
      <div class="s2-eyebrow" id="s2-eyebrow">FIELD FILE 02</div>

      <!-- Family tree SVG -->
      <div class="s2-tree-wrap" id="s2-tree-wrap" data-layout-role="primary" data-layout-act="tree-reveal">
        <svg class="s2-tree-svg" id="s2-tree-svg" viewBox="0 0 984 1120" xmlns="http://www.w3.org/2000/svg">

          <!-- Column headers as SVG text -->
          <text class="s2-col-head" id="s2-head-windsor" x="200" y="48" text-anchor="middle">WINDSORS</text>
          <text class="s2-col-head" id="s2-head-spencer" x="740" y="48" text-anchor="middle">SPENCERS</text>

          <!-- Vertical divider between columns -->
          <line class="s2-divider" id="s2-divider" x1="492" y1="60" x2="492" y2="1080"/>

          <!-- Windsor branch: root trunk descending -->
          <path id="s2-w-trunk" d="M 200 80 L 200 320"/>
          <!-- Windsor left sub-branch -->
          <path id="s2-w-branch-l" d="M 200 200 L 80 280 L 80 380"/>
          <!-- Windsor right sub-branch -->
          <path id="s2-w-branch-r" d="M 200 200 L 320 280 L 320 380"/>
          <!-- Windsor leaf stems -->
          <path id="s2-w-leaf-1" d="M 80 380 L 80 460"/>
          <path id="s2-w-leaf-2" d="M 320 380 L 320 460"/>
          <path id="s2-w-leaf-3" d="M 200 320 L 200 440"/>
          <!-- Windsor cross bar at junction -->
          <path id="s2-w-crossbar" d="M 80 280 L 320 280"/>

          <!-- Spencer branch: root trunk -->
          <path id="s2-s-trunk" d="M 740 80 L 740 320"/>
          <!-- Spencer left sub-branch -->
          <path id="s2-s-branch-l" d="M 740 200 L 620 280 L 620 380"/>
          <!-- Spencer right sub-branch -->
          <path id="s2-s-branch-r" d="M 740 200 L 860 280 L 860 380"/>
          <!-- Spencer leaf stems -->
          <path id="s2-s-leaf-1" d="M 620 380 L 620 460"/>
          <path id="s2-s-leaf-2" d="M 860 380 L 860 460"/>
          <path id="s2-s-leaf-3" d="M 740 320 L 740 440"/>
          <!-- Spencer cross bar -->
          <path id="s2-s-crossbar" d="M 620 280 L 860 280"/>

          <!-- Windsor lower generation -->
          <path id="s2-w-gen2-trunk" d="M 200 520 L 200 680"/>
          <path id="s2-w-gen2-branch-l" d="M 200 600 L 110 660 L 110 760"/>
          <path id="s2-w-gen2-branch-r" d="M 200 600 L 290 660 L 290 760"/>
          <path id="s2-w-gen2-crossbar" d="M 110 660 L 290 660"/>

          <!-- Spencer lower generation -->
          <path id="s2-s-gen2-trunk" d="M 740 520 L 740 680"/>
          <path id="s2-s-gen2-branch-l" d="M 740 600 L 650 660 L 650 760"/>
          <path id="s2-s-gen2-branch-r" d="M 740 600 L 830 660 L 830 760"/>
          <path id="s2-s-gen2-crossbar" d="M 650 660 L 830 660"/>

          <!-- Leaf name labels — Windsor side -->
          <text class="s2-leaf-label" id="s2-wl-1" x="80" y="490" text-anchor="middle">GEORGE V</text>
          <text class="s2-leaf-label" id="s2-wl-2" x="320" y="490" text-anchor="middle">QUEEN MARY</text>
          <text class="s2-leaf-label" id="s2-wl-3" x="200" y="470" text-anchor="middle">SAXE-COBURG</text>
          <text class="s2-leaf-label" id="s2-wl-4" x="110" y="790" text-anchor="middle">EDWARD VIII</text>
          <text class="s2-leaf-label" id="s2-wl-5" x="290" y="790" text-anchor="middle">GEORGE VI</text>

          <!-- Leaf name labels — Spencer side -->
          <text class="s2-leaf-label" id="s2-sl-1" x="620" y="490" text-anchor="middle">6TH EARL</text>
          <text class="s2-leaf-label" id="s2-sl-2" x="860" y="490" text-anchor="middle">LADY SARAH</text>
          <text class="s2-leaf-label" id="s2-sl-3" x="740" y="470" text-anchor="middle">ALTHORPE</text>
          <text class="s2-leaf-label" id="s2-sl-4" x="650" y="790" text-anchor="middle">7TH EARL</text>
          <text class="s2-leaf-label" id="s2-sl-5" x="830" y="790" text-anchor="middle">DIANA</text>

          <!-- Horizontal connector between the two clans (subtle, drawn last) -->
          <path id="s2-clan-bridge" d="M 370 900 Q 492 860 614 900" stroke-dasharray="8 6"/>
        </svg>
      </div>

      <!-- Year-chip row: stamp discrete-text-sequence chips -->
      <div class="s2-chips-row" id="s2-chips-row" data-layout-role="supporting" data-layout-act="year-chips">
        <span class="s2-chip-windsor" id="s2-chip-windsor">1917</span>
        <span class="s2-chip-spencer" id="s2-chip-spencer">500 YEARS</span>
      </div>

      <!-- Bottom scribble note: clip-path write-on -->
      <div class="s2-scribble-wrap" id="s2-scribble-wrap" data-layout-role="supporting" data-layout-act="scribble">
        <p class="s2-scribble" id="s2-scribble">more <span class="s2-underline">English</span> than the English.</p>
      </div>

    </div><!-- end parallax wrap -->

    <script>
      const EASE = {
        entry:    "power2.out",
        emphasis: "power3.out",
        exit:     "power2.in",
        drift:    "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med:  0.5,
        slow: 0.95,
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ── Initial hidden state ──
      gsap.set("#s2-eyebrow",       { opacity: 0 });
      gsap.set("#s2-deco-pin",      { opacity: 0 });
      gsap.set("#s2-head-windsor",  { opacity: 0 });
      gsap.set("#s2-head-spencer",  { opacity: 0 });
      gsap.set("#s2-chip-windsor",  { opacity: 0, scale: 1.08, rotation: -4 });
      gsap.set("#s2-chip-spencer",  { opacity: 0, scale: 1.08, rotation: -4 });
      gsap.set("#s2-scribble",      { opacity: 0 });
      gsap.set(".s2-leaf-label",    { opacity: 0 });

      // Hide all branch paths via dasharray/dashoffset
      const allPaths = document.querySelectorAll(
        "#s2-w-trunk, #s2-w-branch-l, #s2-w-branch-r, #s2-w-crossbar, " +
        "#s2-w-leaf-1, #s2-w-leaf-2, #s2-w-leaf-3, " +
        "#s2-s-trunk, #s2-s-branch-l, #s2-s-branch-r, #s2-s-crossbar, " +
        "#s2-s-leaf-1, #s2-s-leaf-2, #s2-s-leaf-3, " +
        "#s2-w-gen2-trunk, #s2-w-gen2-branch-l, #s2-w-gen2-branch-r, #s2-w-gen2-crossbar, " +
        "#s2-s-gen2-trunk, #s2-s-gen2-branch-l, #s2-s-gen2-branch-r, #s2-s-gen2-crossbar, " +
        "#s2-clan-bridge, #s2-divider"
      );
      allPaths.forEach(function(p) {
        var len = p.getTotalLength ? p.getTotalLength() : 200;
        p.style.strokeDasharray = "" + len;
        p.style.strokeDashoffset = "" + len;
      });

      // ── 0.0s — Eyebrow + deco pin fade in ──
      tl.fromTo("#s2-eyebrow",
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry },
        0.0
      );
      tl.fromTo("#s2-deco-pin",
        { opacity: 0, y: -10 },
        { opacity: 0.55, y: 0, duration: DUR.slow, ease: EASE.entry },
        0.1
      );

      // ── 0.2s — Divider draws ──
      tl.to("#s2-divider", {
        strokeDashoffset: 0, duration: 0.7, ease: "none"
      }, 0.2);

      // ── 0.3s — Column headers fade in ──
      tl.fromTo("#s2-head-windsor",
        { opacity: 0 }, { opacity: 1, duration: DUR.med, ease: EASE.entry },
        0.3
      );
      tl.fromTo("#s2-head-spencer",
        { opacity: 0 }, { opacity: 1, duration: DUR.med, ease: EASE.entry },
        0.4
      );

      // ── SVG PATH DRAW — branch lines 0.5s → 3s ──
      // Windsor trunk first
      tl.to("#s2-w-trunk",  { strokeDashoffset: 0, duration: 0.45, ease: EASE.entry }, 0.5);
      tl.to("#s2-s-trunk",  { strokeDashoffset: 0, duration: 0.45, ease: EASE.entry }, 0.55);
      // Cross bars
      tl.to("#s2-w-crossbar", { strokeDashoffset: 0, duration: 0.3, ease: EASE.entry }, 0.85);
      tl.to("#s2-s-crossbar", { strokeDashoffset: 0, duration: 0.3, ease: EASE.entry }, 0.9);
      // Sub-branches
      tl.to("#s2-w-branch-l", { strokeDashoffset: 0, duration: 0.4, ease: EASE.entry }, 1.0);
      tl.to("#s2-w-branch-r", { strokeDashoffset: 0, duration: 0.4, ease: EASE.entry }, 1.1);
      tl.to("#s2-s-branch-l", { strokeDashoffset: 0, duration: 0.4, ease: EASE.entry }, 1.05);
      tl.to("#s2-s-branch-r", { strokeDashoffset: 0, duration: 0.4, ease: EASE.entry }, 1.15);
      // Leaf stems
      tl.to("#s2-w-leaf-1", { strokeDashoffset: 0, duration: 0.25, ease: EASE.entry }, 1.35);
      tl.to("#s2-w-leaf-2", { strokeDashoffset: 0, duration: 0.25, ease: EASE.entry }, 1.4);
      tl.to("#s2-w-leaf-3", { strokeDashoffset: 0, duration: 0.25, ease: EASE.entry }, 1.45);
      tl.to("#s2-s-leaf-1", { strokeDashoffset: 0, duration: 0.25, ease: EASE.entry }, 1.38);
      tl.to("#s2-s-leaf-2", { strokeDashoffset: 0, duration: 0.25, ease: EASE.entry }, 1.43);
      tl.to("#s2-s-leaf-3", { strokeDashoffset: 0, duration: 0.25, ease: EASE.entry }, 1.48);
      // First-generation leaf labels
      tl.fromTo(".s2-leaf-label",
        { opacity: 0 }, { opacity: 1, duration: DUR.med, ease: EASE.entry, stagger: 0.06 },
        1.55
      );
      // Gen2 branches
      tl.to("#s2-w-gen2-trunk",     { strokeDashoffset: 0, duration: 0.35, ease: EASE.entry }, 1.9);
      tl.to("#s2-s-gen2-trunk",     { strokeDashoffset: 0, duration: 0.35, ease: EASE.entry }, 1.95);
      tl.to("#s2-w-gen2-crossbar",  { strokeDashoffset: 0, duration: 0.25, ease: EASE.entry }, 2.2);
      tl.to("#s2-s-gen2-crossbar",  { strokeDashoffset: 0, duration: 0.25, ease: EASE.entry }, 2.25);
      tl.to("#s2-w-gen2-branch-l",  { strokeDashoffset: 0, duration: 0.3,  ease: EASE.entry }, 2.4);
      tl.to("#s2-w-gen2-branch-r",  { strokeDashoffset: 0, duration: 0.3,  ease: EASE.entry }, 2.45);
      tl.to("#s2-s-gen2-branch-l",  { strokeDashoffset: 0, duration: 0.3,  ease: EASE.entry }, 2.42);
      tl.to("#s2-s-gen2-branch-r",  { strokeDashoffset: 0, duration: 0.3,  ease: EASE.entry }, 2.47);
      // Clan bridge drawn last
      tl.to("#s2-clan-bridge",      { strokeDashoffset: 0, duration: 0.5,  ease: EASE.entry }, 2.7);

      // ── DISCRETE TEXT SEQUENCE — Year chips stamp in at ~3s ──
      // Windsor chip: "1917" (stamp-slam — scale 1.08 → 1 at -4° rotation)
      tl.fromTo("#s2-chip-windsor",
        { opacity: 0, scale: 1.08, rotation: -4 },
        { opacity: 1, scale: 1,    rotation: -4, duration: DUR.snap, ease: EASE.emphasis },
        3.1
      );
      // Spencer chip: "500 YEARS" stamps in shortly after
      tl.fromTo("#s2-chip-spencer",
        { opacity: 0, scale: 1.08, rotation: -4 },
        { opacity: 1, scale: 1,    rotation: -4, duration: DUR.snap, ease: EASE.emphasis },
        3.4
      );

      // ── Scribble write-on (clip-path left→right reveal) at 3.8s ──
      // Approach: animate from opacity 0 to 1 at scribble's -2deg tilt (via GSAP rotation)
      // with clipPath reveal via scaleX on the wrap
      gsap.set("#s2-scribble-wrap", { overflow: "hidden" });
      tl.fromTo("#s2-scribble",
        { opacity: 1, clipPath: "inset(0 100% 0 0)", rotation: -2 },
        { opacity: 1, clipPath: "inset(0 0% 0 0)",   rotation: -2, duration: DUR.slow, ease: EASE.entry },
        3.8
      );

      // ── Macro camera: slow parallax push rightward ──
      // parallax-wrap starts at x=0, pushes to x=-80 over 6s (rightward eye movement)
      tl.fromTo("#s2-parallax-wrap",
        { x: 0 },
        { x: -80, duration: 6, ease: "none" },
        0
      );

      // ── SINE WAVE LOOP — diagram breathing from ~1.5s ──
      // Breathing on the tree wrap (subtle scale/y) after initial branches appear
      const treePhase = { p: 0 };
      const IDLE_START = 1.5;
      const IDLE_DUR   = 6 - IDLE_START;  // 4.5s
      const CYCLES     = IDLE_DUR / 2.8;  // ~1.6 cycles, period ~2.8s
      const SCALE_AMP  = 0.008;
      const Y_AMP      = 2;

      tl.to(treePhase, {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: function() {
          var s = 1 + Math.sin(treePhase.p) * SCALE_AMP;
          var y = Math.sin(treePhase.p) * Y_AMP;
          document.getElementById("s2-tree-wrap").style.transform =
            "translateY(" + y + "px) scale(" + s + ")";
        }
      }, IDLE_START);

      // Pin deco subtle drift (offset by π/2)
      var pinPhase = { p: 0 };
      tl.to(pinPhase, {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: function() {
          var r = Math.sin(pinPhase.p + Math.PI / 2) * 1.2;
          document.getElementById("s2-deco-pin").style.transform =
            "rotate(" + r + "deg)";
        }
      }, IDLE_START);

      window.__timelines["scene_2"] = tl;
    </script>
  </div>
</template>
